<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OK Trainer</title>
<meta name="theme-color" content="#eee8d9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12181a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OK Trainer">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  @font-face{
    font-family:"Ubuntu Mono Local";
    font-style:normal;
    font-weight:400;
    font-display:swap;
    src:url("fonts/UbuntuMono-Regular.woff2") format("woff2");
    unicode-range:U+0100-024F,U+1E00-1EFF,U+20A0-20AB,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:"Ubuntu Mono Local";
    font-style:normal;
    font-weight:400;
    font-display:swap;
    src:url("fonts/UbuntuMono-Regular-Latin.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F;
  }
  @font-face{
    font-family:"Ubuntu Mono Local";
    font-style:normal;
    font-weight:700;
    font-display:swap;
    src:url("fonts/UbuntuMono-Bold.woff2") format("woff2");
    unicode-range:U+0100-024F,U+1E00-1EFF,U+20A0-20AB,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:"Ubuntu Mono Local";
    font-style:normal;
    font-weight:700;
    font-display:swap;
    src:url("fonts/UbuntuMono-Bold-Latin.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F;
  }
  :root{
    --chassis:#12181a;
    --panel:#1b2426;
    --panel-2:#212c2e;
    --border:#2a3436;
    --text:#eae6d9;
    --text-muted:#8b9a95;
    --panel-accent:#ffb020;
    --panel-accent-dim:#8a6a2c;
    --green-ui:#6fe3a0;
    --green-dim-ui:#2f5c48;
    --red-ui:#e2543a;
    --red-dim-ui:#6b2f26;

    --lcd:#0c1a17;
    --lcd-border:#324442;
    --lcd-text:#eae6d9;
    --lcd-muted:#8b9a95;
    --amber:#ffb020;
    --green:#6fe3a0;
    --red:#e2543a;

    --mono: "Ubuntu Mono Local", monospace;
    --serif: Georgia, "Times New Roman", serif;
    --sans: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{
      --chassis:#eee8d9;
      --panel:#ffffff;
      --panel-2:#efe8d6;
      --border:#d9d2bd;
      --text:#2b2a25;
      --text-muted:#6b6558;
      --panel-accent:#a85d00;
      --panel-accent-dim:#d9b27a;
      --green-ui:#1f8a5c;
      --green-dim-ui:#8fc7ac;
      --red-ui:#c23b26;
      --red-dim-ui:#e3a89a;
      --lcd:#ffffff;
      --lcd-border:#d9d2bd;
      --lcd-text:#2b2a25;
      --lcd-muted:#948c78;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--chassis);
    color:var(--text);
    font-family:var(--sans);
    font-feature-settings: "zero" 1, "ss01" 1;
    min-height:100vh;
    padding:24px 16px 60px;
    display:flex;
    justify-content:center;
  }
  .wrap{width:100%;max-width:640px;}
  .hidden{display:none;}
  header{margin-bottom:18px;text-align:center;position:relative;padding:0 52px;}
  .settings-btn{
    position:absolute;
    top:0;
    right:0;
    font-size:20px;
  }
  .settings-header{
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    margin-bottom:22px;
  }
  .settings-title{
    font-family:var(--sans);
    font-size:16px;
    font-weight:600;
    color:var(--text);
    margin:0;
  }
  .settings-label{
    font-family:var(--sans);
    font-size:12px;
    color:var(--text-muted);
    letter-spacing:0.5px;
    margin:26px 0 6px;
  }
  .settings-label:first-of-type{
    margin-top:0;
  }
  .callsign{
    font-family:var(--serif);
    font-size:26px;
    letter-spacing:2px;
    color:var(--panel-accent);
    margin:0 0 4px;
  }
  .sub{
    font-family:var(--sans);
    font-size:12px;
    color:var(--text-muted);
    letter-spacing:0.5px;
    padding:0 8px;
  }

  .set-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin:0;
  }
  .set-row .selectbar{
    flex:1;
    min-width:0;
  }
  .selectbar{
    position:relative;
  }
  .selectbar select{
    width:100%;
    font-family:var(--sans);
    font-size:13px;
    padding:10px 12px;
    padding-right:28px;
    background:var(--panel);
    color:var(--panel-accent);
    border:1px solid var(--border);
    border-radius:8px;
    appearance:none;
    -webkit-appearance:none;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .selectbar::after{
    content:"▾";
    position:absolute;
    right:16px;
    top:12px;
    color:var(--text-muted);
    font-size:12px;
    pointer-events:none;
  }
  .icon-btn{
    flex-shrink:0;
    width:40px;
    height:40px;
    font-size:16px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    cursor:pointer;
    color:var(--text);
  }
  .icon-btn:hover{background:var(--panel-2);}
  .icon-btn:disabled{opacity:0.3;cursor:default;}

  #areaSelectBar{
    margin:0 0 10px;
  }
  .subgroupbar{
    margin-bottom:14px;
    display:none;
  }
  .subgroupbar.visible{display:block;}
  .statbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .counts{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-muted);
    display:flex;
    gap:14px;
  }
  .counts b{color:var(--text);font-weight:600;}
  .counts .ok{color:var(--green-ui);}
  .counts .bad{color:var(--red-ui);}
  .header-progress{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .header-progress .box-bars{width:45px;height:22px;}
  .card{
    background:var(--lcd);
    border:2px solid var(--lcd-border);
    border-radius:12px;
    min-height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px 24px;
    cursor:pointer;
    user-select:none;
    position:relative;
  }
  .card .tag{
    position:absolute;
    top:12px;
    left:16px;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:1px;
    color:var(--lcd-muted);
    text-transform:uppercase;
    max-width:70%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .card .hint{
    position:absolute;
    bottom:12px;
    right:16px;
    font-family:var(--mono);
    font-size:10px;
    color:var(--lcd-muted);
  }
  .card .face{
    font-family:var(--serif);
    font-size:20px;
    line-height:1.5;
    color:var(--lcd-text);
  }
  .card.flipped .face{
    font-family:var(--mono);
    font-feature-settings:"zero" 1;
    font-variant-numeric:slashed-zero;
    font-size:24px;
    color:var(--panel-accent);
    font-weight:600;
  }
  .card.done{
    color:var(--green-ui);
  }
  .controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:16px;
  }
  .controls button{
    font-family:var(--sans);
    font-size:14px;
    font-weight:600;
    padding:14px 10px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid;
  }
  #btnBad{
    background:transparent;
    color:var(--red-ui);
    border-color:var(--red-dim-ui);
  }
  #btnBad:hover{background:rgba(226,84,58,0.1);}
  #btnGood{
    background:transparent;
    color:var(--green-ui);
    border-color:var(--green-dim-ui);
  }
  #btnGood:hover{background:rgba(111,227,160,0.1);}
  .controls button:disabled{opacity:0.35;cursor:default;}
  .driving-row{
    margin-top:14px;
    text-align:center;
  }
  .driving-btn{
    width:100%;
    font-family:var(--sans);
    font-size:14px;
    font-weight:600;
    padding:12px 10px;
    border-radius:8px;
    cursor:pointer;
    background:transparent;
    color:var(--panel-accent);
    border:1px solid var(--panel-accent-dim);
  }
  .driving-btn:hover{background:rgba(255,176,32,0.08);}
  .driving-btn.active{
    background:var(--panel-accent);
    color:var(--chassis);
    border-color:var(--panel-accent);
  }
  .driving-hint{
    margin:8px 0 0;
    font-family:var(--mono);
    font-size:10.5px;
    line-height:1.5;
    color:var(--text-muted);
  }
  .toolbar{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:18px;
    flex-wrap:wrap;
    gap:10px;
  }
  .toolbar label{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .reset-row{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:24px;
  }
  .reset-btn{
    font-family:var(--sans);
    font-size:12px;
    font-weight:600;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    background:transparent;
    color:var(--red-ui);
    border:1px solid var(--red-dim-ui);
  }
  .reset-btn:hover{background:rgba(226,84,58,0.08);}
  .keys{
    margin-top:22px;
    text-align:center;
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-muted);
  }
  .keys kbd{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:4px;
    padding:1px 6px;
    color:var(--text);
  }
  .stats{margin-top:30px;}
  .stats-title{
    font-family:var(--serif);
    font-size:15px;
    color:var(--text-muted);
    text-align:center;
    letter-spacing:1px;
    margin:0 0 12px;
  }
  .stats-cat{
    margin-top:16px;
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
  }
  .stats-cat:first-child{margin-top:0;}
  .stats-cat:hover{background:var(--panel);}
  .stats-cat-head{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .stats-cat-name{
    flex:1;
    font-family:var(--serif);
    font-size:16px;
    font-weight:700;
    color:var(--text);
  }
  .box-bars{
    display:flex;
    align-items:flex-end;
    gap:2px;
    width:40px;
    height:20px;
    flex-shrink:0;
  }
  .stats-cat .box-bars{width:50px;height:24px;}
  .box-bar{
    flex:1;
    min-width:2px;
    border-radius:1px 1px 0 0;
    background:var(--border);
  }
  .pass-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    flex-shrink:0;
    display:none;
  }
  .pass-dot.visible{display:inline-block;}
  .urgency-bar{
    font-family:var(--mono);
    font-size:14px;
    line-height:1;
    flex-shrink:0;
    display:inline-flex;
  }
  .stats-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:5px 10px 5px 22px;
    border-radius:6px;
    cursor:pointer;
  }
  .stats-row:hover{background:var(--panel);}
  .stats-row-name{
    flex:1;
    font-family:var(--sans);
    font-size:13px;
    color:var(--text-muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  footer a{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-muted);
    text-decoration:none;
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="mainScreen">
    <header>
      <button id="btnOpenSettings" class="icon-btn settings-btn" data-i18n-title="settings_title">⋮</button>
      <p class="callsign">OK TRAINER</p>
      <p class="sub" id="subLabel">…</p>
    </header>

    <div class="selectbar" id="areaSelectBar">
      <select id="areaSelect"></select>
    </div>

    <div class="selectbar subgroupbar" id="subgroupbar">
      <select id="subgroupSelect"></select>
    </div>

    <div class="statbar">
      <div class="counts">
        <span><span data-i18n="remaining"></span> <b id="cntLeft">0</b></span>
      </div>
      <div class="header-progress" id="headerProgress">
        <span class="pass-dot" id="headerDot"></span>
        <div class="box-bars" id="headerBoxBars"></div>
      </div>
    </div>

    <div class="card" id="card">
      <span class="tag" id="cardTag">—</span>
      <div class="face" id="cardFace">…</div>
      <span class="hint" id="cardHint" data-i18n="tap_to_flip"></span>
    </div>

    <div class="controls">
      <button id="btnBad" disabled data-i18n="btn_dont_know"></button>
      <button id="btnGood" disabled data-i18n="btn_know"></button>
    </div>

    <div class="driving-row">
      <button id="btnDriving" class="driving-btn" data-i18n="driving_start"></button>
      <p class="driving-hint" id="drivingHint" data-i18n="driving_hint"></p>
    </div>

    <div class="toolbar">
      <label><input type="checkbox" id="onlyHard"> <span data-i18n="only_hard"></span></label>
    </div>

    <p class="keys">
      <kbd data-i18n="key_space"></kbd> <span data-i18n="key_flip"></span> &nbsp; <kbd>←</kbd> <span data-i18n="key_dont_know"></span> &nbsp; <kbd>→</kbd> <span data-i18n="key_know"></span>
    </p>

    <section class="stats">
      <p class="stats-title" data-i18n="stats_title"></p>
      <div id="statsList"></div>
    </section>

    <div class="reset-row">
      <button id="btnResetScope" class="reset-btn" data-i18n="reset_scope_btn"></button>
      <button id="btnResetAll" class="reset-btn" data-i18n="reset_all_btn"></button>
    </div>
  </div>

  <div id="settingsScreen" class="hidden">
    <header class="settings-header">
      <button id="btnCloseSettings" class="icon-btn" data-i18n-title="back_btn_title">←</button>
      <p class="settings-title" data-i18n="settings_title"></p>
    </header>

    <p class="settings-label" data-i18n="label_lang"></p>
    <div class="set-row">
      <div class="selectbar">
        <select id="langSelect"></select>
      </div>
      <button id="btnImportLang" class="icon-btn" data-i18n-title="import_lang_title">📥</button>
      <button id="btnDeleteLang" class="icon-btn" data-i18n-title="delete_lang_title">🗑️</button>
      <input type="file" id="fileImportLangInput" accept="application/json,.json" style="display:none;">
    </div>

    <p class="settings-label" data-i18n="label_set"></p>
    <div class="set-row">
      <div class="selectbar">
        <select id="setSelect"></select>
      </div>
      <button id="btnImportSet" class="icon-btn" data-i18n-title="import_set_title">📥</button>
      <button id="btnDeleteSet" class="icon-btn" data-i18n-title="delete_set_title">🗑️</button>
      <input type="file" id="fileImportInput" accept="application/json,.json" style="display:none;">
    </div>

    <p class="settings-label" data-i18n="label_spell"></p>
    <div class="set-row">
      <div class="selectbar">
        <select id="spellSelect"></select>
      </div>
      <button id="btnImportSpell" class="icon-btn" data-i18n-title="import_spell_title">📥</button>
      <button id="btnDeleteSpell" class="icon-btn" data-i18n-title="delete_spell_title">🗑️</button>
      <input type="file" id="fileImportSpellInput" accept="application/json,.json" style="display:none;">
    </div>

    <p class="settings-label" data-i18n="label_stats"></p>
    <div class="set-row">
      <button id="btnExportStats" class="icon-btn" data-i18n-title="export_stats_title">📤</button>
      <button id="btnImportStats" class="icon-btn" data-i18n-title="import_stats_title">📥</button>
      <input type="file" id="fileImportStatsInput" accept="application/json,.json" style="display:none;">
    </div>
  </div>

  <footer style="margin-top:28px;text-align:center;">
    <a href="https://github.com/Dushino/OK-Trainer" target="_blank" rel="noopener" id="footerLink">https://github.com/Dushino/OK-Trainer</a>
  </footer>
</div>

<script>
// ============================================================
// Built-in tutorial set — also serves as a format example.
// ============================================================
const TUTORIAL_SET = {

// ============================================================
// Interface language (GUI) — built-in English + import of further
// packs the same way as with flashcard sets.
// ============================================================
const EN_STRINGS = {
  import_set_title: "Import set",
  delete_set_title: "Delete set",

  delete_lang_title: "Delete language",

  settings_title: "Settings",

  label_lang: "Interface language",
  label_set: "Card set",
  label_spell: "Spelling alphabet",
  label_stats: "Statistics for the current set",
  urgency_title: "{pct}% likely forgotten by now",
  remaining: "remaining",
  tap_to_flip: "tap to flip",
  tap_to_flip_back: "tap to flip back",
  round_done: "Round complete ✓ — tap for a new round",
  btn_dont_know: "✗ Don't know",
  btn_know: "✓ Know",
  driving_start: "🎧  Start handsfree mode",
  driving_stop: "🎧  Stop handsfree mode",

  key_flip: "flip",
  key_dont_know: "don't know",
  key_know: "know",
  stats_title: "Success statistics",
  reset_scope_btn: "🔄 reset stats for selected area",
  reset_all_btn: "🗑️ reset all stats for this set",

// falls back to the built-in English, so importing an incomplete pack can
// never break the app.

  const pack = langLibrary[activeLangId];
  let s = (pack && pack.strings && pack.strings[key]) || EN_STRINGS[key] || key;
  if(vars) Object.keys(vars).forEach(k => { s = s.split("{" + k + "}").join(String(vars[k])); });
  return s;
}

const BUILTIN_ID = TUTORIAL_SET.shortName;
const MAX_AREAS = 100;
const MAX_SUBAREAS = 1000;

// ============================================================
// Storage: library of sets + progress/statistics tied to the active set
// ============================================================
const LIB_KEY = "oktrainer_library_v1";
const ACTIVE_KEY = "oktrainer_active_v1";

function loadLibrary(){

  }catch(e){

  }
}

}

function progressKey(id){ return "oktrainer_progress_v1__" + id; }
function navKey(id){ return "oktrainer_lastnav_v1__" + id; }

function loadProgressFor(id){
  try{
    const raw = localStorage.getItem(progressKey(id));
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(){
  try{ localStorage.setItem(progressKey(activeSetId), JSON.stringify(progress)); }catch(e){}
}
function wipeSetData(id){
  try{
    localStorage.removeItem(progressKey(id));
    localStorage.removeItem(navKey(id));
  }catch(e){}
}

let library = loadLibrary();
let activeSetId = localStorage.getItem(ACTIVE_KEY) || BUILTIN_ID;
if(!library[activeSetId]) activeSetId = BUILTIN_ID;

let progress = {};

// DATA / GROUP_ORDER / CAT_LABELS are built dynamically from the active
// set on every switch — everything else in the app (boxes, shuffling,
// statistics, handsfree) still just treats "cat" as a generic key.
let DATA = {};
let GROUP_ORDER = {};
let CAT_LABELS = {};
let STATS_CAT_LABELS = {};
let AREA_MAX_ERRORS = {};
// Text used to speak an area/subarea name in handsfree mode — from the
// optional areas[].nameTts / subareas[].nameTts, otherwise the "name" itself.
let AREA_NAME_SPOKEN = {};
let SUBAREA_NAME_SPOKEN = {};

function applyActiveSet(setObj){
  DATA = {}; GROUP_ORDER = {}; CAT_LABELS = {}; STATS_CAT_LABELS = {}; AREA_MAX_ERRORS = {};
  AREA_NAME_SPOKEN = {}; SUBAREA_NAME_SPOKEN = {};
  setObj.areas.forEach((area, ai) => {
    const key = String(ai);
    CAT_LABELS[key] = area.name.toUpperCase();
    STATS_CAT_LABELS[key] = area.name;
    AREA_NAME_SPOKEN[key] = (area.nameTts || "").trim() || area.name;
    GROUP_ORDER[key] = area.subareas.map(sa => sa.name);
    AREA_MAX_ERRORS[key] = Number.isFinite(area.maxErrors) ? area.maxErrors : null;
    SUBAREA_NAME_SPOKEN[key] = {};
    DATA[key] = [];
    area.subareas.forEach(sa => {
      SUBAREA_NAME_SPOKEN[key][sa.name] = (sa.nameTts || "").trim() || sa.name;
      sa.cards.forEach(c => {
        DATA[key].push({front: c.front, back: c.back, group: sa.name, frontTts: c.frontTts, backTts: c.backTts});
      });
    });
  });
}

// ============================================================
// Validation of the imported file
// ============================================================
function validateSet(obj){
  const errs = [];
  if(!obj || typeof obj !== "object"){ errs.push(t("val_not_object")); return errs; }
  if(!obj.shortName || typeof obj.shortName !== "string") errs.push(t("val_missing_field", {field: "shortName"}));
  if(!obj.longName || typeof obj.longName !== "string") errs.push(t("val_missing_field", {field: "longName"}));
  if(!obj.language || typeof obj.language !== "string") errs.push(t("val_missing_language"));
  if(!Array.isArray(obj.areas) || obj.areas.length === 0){
    errs.push(t("val_no_areas"));
    return errs;
  }
  if(obj.areas.length > MAX_AREAS) errs.push(t("val_too_many_areas", {max: MAX_AREAS, n: obj.areas.length}));
  obj.areas.forEach((area, ai) => {
    const label = t("val_area_label", {n: ai+1}) + (area && area.name ? " (\"" + area.name + "\")" : "");
    if(!area || !area.name || typeof area.name !== "string") errs.push(t("val_no_name", {label}));
    if(!area || !Array.isArray(area.subareas) || area.subareas.length === 0){
      errs.push(t("val_no_subareas", {label}));
      return;
    }
    if(area.subareas.length > MAX_SUBAREAS) errs.push(t("val_too_many_subareas", {label, max: MAX_SUBAREAS, n: area.subareas.length}));
    area.subareas.forEach((sa, si) => {
      const slabel = t("val_subarea_label", {area: label, n: si+1}) + (sa && sa.name ? " (\"" + sa.name + "\")" : "");
      if(!sa || !sa.name || typeof sa.name !== "string") errs.push(t("val_no_name", {label: slabel}));
      if(!sa || !Array.isArray(sa.cards) || sa.cards.length === 0){
        errs.push(t("val_no_cards", {label: slabel}));
        return;
      }
      sa.cards.forEach((c, ci) => {
        if(!c || typeof c.front !== "string" || !c.front) errs.push(t("val_card_no_front", {label: slabel, n: ci+1}));
        if(!c || typeof c.back !== "string" || !c.back) errs.push(t("val_card_no_back", {label: slabel, n: ci+1}));
      });
    });
  });
  return errs;
}

// Export / import of statistics for the active set
// ============================================================
// Statistics are keyed by card position (cat:idx), not a stable ID, so
// on import we check both the set's shortName and the card count in
// each area — otherwise the boxes could end up attached to the wrong cards.
function statsCardCounts(){
  return Object.keys(DATA).sort((a,b) => Number(a) - Number(b)).map(k => DATA[k].length);
}
function validateStatsExport(obj){
  const errs = [];
  if(!obj || typeof obj !== "object"){ errs.push(t("val_not_object")); return errs; }
  if(!obj.shortName || typeof obj.shortName !== "string") errs.push(t("val_missing_field", {field: "shortName"}));
  if(!obj.progress || typeof obj.progress !== "object" || Array.isArray(obj.progress)) errs.push(t("val_missing_field", {field: "progress"}));
  if(!Array.isArray(obj.cardCounts)) errs.push(t("val_missing_field", {field: "cardCounts"}));
  return errs;
}
function sanitizeFilenamePart(s){
  return String(s).trim().replace(/\s+/g, "-").replace(/[\\/:*?"<>|]/g, "");
}

document.getElementById("btnExportStats").addEventListener("click", () => {
  const payload = {
    formatVersion: 1,
    shortName: activeSetId,
    exportedAt: new Date().toISOString(),
    cardCounts: statsCardCounts(),
    progress
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const dateStr = new Date().toISOString().slice(0, 10);
  const a = document.createElement("a");
  a.href = url;
  a.download = "oktrainer-stats_" + sanitizeFilenamePart(activeSetId) + "_" + dateStr + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById("fileImportStatsInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let obj;
    try{
      obj = JSON.parse(reader.result);
    }catch(err){
      alert(t("err_invalid_json", {msg: err.message}));
      e.target.value = "";
      return;
    }
    const errs = validateStatsExport(obj);
    if(errs.length){
      alert(t("err_invalid_structure", {errs: errs.join("\n")}));
      e.target.value = "";
      return;
    }
    if(obj.shortName !== activeSetId){
      alert(t("err_stats_set_mismatch", {expected: activeSetId, found: obj.shortName}));
      e.target.value = "";
      return;
    }
    const expected = statsCardCounts();
    const countsMatch = obj.cardCounts.length === expected.length
      && obj.cardCounts.every((n, i) => n === expected[i]);
    if(!countsMatch){
      alert(t("err_stats_structure_mismatch"));
      e.target.value = "";
      return;
    }
    const ok = confirm(t("confirm_stats_overwrite", {name: activeSetId}));
    if(!ok){ e.target.value = ""; return; }
    progress = obj.progress;
    saveProgress();
    renderStats();
    e.target.value = "";
  };
  reader.readAsText(file, "utf-8");
});

// ============================================================
// Leitner "boxes" (repetition control) — tied to the active set
// ============================================================
function cardKey(cat, idx){ return cat + ":" + idx; }
// A progress entry used to be a bare box number (1-5); it's now
// {box, lastSeen, lapses} so we can estimate forgetting (see
// cardUrgency() below). Old bare-number entries are normalized on read —
// no eager migration needed.
function getEntry(cat, idx){
  const raw = progress[cardKey(cat, idx)];
  if(raw && typeof raw === "object") return raw;
  return {box: raw || 1, lastSeen: null, lapses: 0};
}
function getBox(cat, idx){
  return getEntry(cat, idx).box;
}
function recordAnswer(cat, idx, good){
  const entry = getEntry(cat, idx);
  const box = Math.max(1, Math.min(5, good ? entry.box + 1 : 1));
  const lapses = good ? entry.lapses : entry.lapses + 1;
  progress[cardKey(cat, idx)] = {box, lastSeen: Date.now(), lapses};
  saveProgress();
}

// ============================================================
// Current round state
// ============================================================
let state = {
  cat: "0",
  group: "__all__",
  deck: [],
  pos: 0,
  flipped: false,
  sessionGood: 0,
  sessionBad: 0
};

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// Builds the card order so the same card never appears twice in a row,
// while keeping the proportional representation by Leitner box (greedy
// based on the remaining count).
function buildNoAdjacentSequence(countsObj){
  let items = Object.keys(countsObj).map(k => ({idx: Number(k), count: countsObj[k]}));
  const total = items.reduce((a,b) => a + b.count, 0);
  let result = [];
  let last = null;
  while(result.length < total){
    let candidates = items.filter(i => i.count > 0 && i.idx !== last);
    if(candidates.length === 0){
      candidates = items.filter(i => i.count > 0);
    }
    const maxCount = Math.max(...candidates.map(c => c.count));
    const top = candidates.filter(c => c.count === maxCount);
    const choice = top[Math.floor(Math.random() * top.length)];
    result.push(choice.idx);
    choice.count--;
    last = choice.idx;
  }
  return result;
}

function hasGroups(cat){
  return !!GROUP_ORDER[cat];
}

function renderSubgroupBar(){
  const bar = document.getElementById("subgroupbar");
  const sel = document.getElementById("subgroupSelect");
  if(!hasGroups(state.cat)){
    bar.classList.remove("visible");
    return;
  }
  bar.classList.add("visible");
  const groups = GROUP_ORDER[state.cat];
  const label = t("all_prefix") + " " + (STATS_CAT_LABELS[state.cat] || "");
  let html = '<option value="__all__">' + label + '</option>';
  groups.forEach(g => {
    html += '<option value="' + g.replace(/"/g,'&quot;') + '">' + g + '</option>';
  });
  sel.innerHTML = html;
  sel.value = state.group;
}

function buildDeck(){
  const items = DATA[state.cat] || [];
  const onlyHard = document.getElementById("onlyHard").checked;
  let indices = items.map((_, i) => i);
  if(hasGroups(state.cat) && state.group !== "__all__"){
    indices = indices.filter(i => items[i].group === state.group);
  }
  if(onlyHard){
    const filteredByHard = indices.filter(i => getBox(state.cat, i) <= 2);
    if(filteredByHard.length > 0) indices = filteredByHard;
  }
  const counts = {};
  indices.forEach(i => {
    const box = getBox(state.cat, i);
    counts[i] = Math.max(1, 6 - box);
  });
  state.deck = Object.keys(counts).length ? buildNoAdjacentSequence(counts) : [];
  state.pos = 0;
  state.flipped = false;
}

function currentItem(){
  const items = DATA[state.cat] || [];
  if(state.pos >= state.deck.length) return null;
  const idx = state.deck[state.pos];
  const it = items[idx];
  return {idx, front: it.front, back: it.back, frontTts: it.frontTts, backTts: it.backTts};
}

function renderCard(){
  const card = document.getElementById("card");
  const face = document.getElementById("cardFace");
  const hint = document.getElementById("cardHint");
  const tag = document.getElementById("cardTag");
  const groupLabel = hasGroups(state.cat) && state.group !== "__all__" ? " · " + state.group : "";
  tag.textContent = (CAT_LABELS[state.cat] || "") + groupLabel;
  const item = currentItem();
  const btnGood = document.getElementById("btnGood");
  const btnBad = document.getElementById("btnBad");

  if(!item){
    card.classList.remove("flipped");
    card.classList.add("done");
    face.textContent = t("round_done");
    hint.textContent = "";
    btnGood.disabled = true;
    btnBad.disabled = true;
    updateStats();
    return;
  }
  card.classList.remove("done");
  if(state.flipped){
    card.classList.add("flipped");
    face.textContent = item.back;
    hint.textContent = t("tap_to_flip_back");
    btnGood.disabled = false;
    btnBad.disabled = false;
  }else{
    card.classList.remove("flipped");
    face.textContent = item.front;
    hint.textContent = t("tap_to_flip");
    btnGood.disabled = true;
    btnBad.disabled = true;
  }
  updateStats();
}

function updateStats(){
  document.getElementById("cntLeft").textContent = Math.max(0, state.deck.length - state.pos);
  updateHeaderProgress();
}

function cssVar(name, fallback){
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}

function updateHeaderProgress(){
  const wholeArea = !hasGroups(state.cat) || state.group === "__all__";
  const {counts, total} = boxCounts(state.cat, wholeArea ? "__all__" : state.group);
  const boxBars = document.getElementById("headerBoxBars");
  if(boxBars) boxBars.innerHTML = boxBarsInnerHtml(counts, total);
  const dot = document.getElementById("headerDot");
  if(dot){
    const info = wholeArea ? passDotInfo(state.cat) : null;
    dot.classList.toggle("visible", !!info);
    if(info){ dot.style.background = info.color; dot.title = Math.round(info.pct) + "%"; }
  }
}

function flip(){
  if(!currentItem()){
    state.sessionGood = 0; state.sessionBad = 0;
    buildDeck();
    renderCard();
    return;
  }
  state.flipped = !state.flipped;
  renderCard();
}

function grade(good){
  const item = currentItem();
  if(!item) return;
  recordAnswer(state.cat, item.idx, good);
  if(good) state.sessionGood++; else state.sessionBad++;
  state.pos++;
  state.flipped = false;
  renderCard();
  renderStats();
}

function renderAreaNav(){
  const sel = document.getElementById("areaSelect");
  sel.innerHTML = Object.keys(CAT_LABELS).map(cat =>
    '<option value="' + cat + '">' + CAT_LABELS[cat] + '</option>'
  ).join("");
}

function setCategory(cat, forcedGroup){
  state.cat = cat;
  if(forcedGroup !== undefined && forcedGroup !== null){
    state.group = forcedGroup;
  }else{
    const validGroups = GROUP_ORDER[cat] || [];
    state.group = validGroups.length ? "__all__" : "__all__";
  }
  document.getElementById("areaSelect").value = cat;
  state.sessionGood = 0;
  state.sessionBad = 0;
  renderSubgroupBar();
  buildDeck();
  renderCard();
  saveLastNav();
}

function setGroup(group){
  state.group = group;
  state.sessionGood = 0;
  state.sessionBad = 0;
  buildDeck();
  renderCard();
  saveLastNav();
}

// ============================================================
// Success statistics
// ============================================================
// Logarithmic curve for the color transition from orange (30°) to green (90°)
// Input: percentage 0-1, where 0 = orange (30°), 1 = green (90°)
function logarithmicHue(normalizedPct) {
  const logVal = Math.log10(Math.max(0, Math.min(1, normalizedPct)) * 9 + 1);
  return 30 + logVal * 60; // logVal runs from 0 to 1, hue from 30° to 90°
}
function hexToRgb(hex){
  hex = hex.replace('#','').trim();
  if(hex.length === 3) hex = hex.split('').map(c => c+c).join('');
  const num = parseInt(hex, 16) || 0;
  return {r:(num>>16)&255, g:(num>>8)&255, b:num&255};
}
function rgbToHex(r,g,b){
  const h = x => Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0');
  return '#' + h(r) + h(g) + h(b);
}
function lerpColor(c1, c2, t){
  return {r:c1.r+(c2.r-c1.r)*t, g:c1.g+(c2.g-c1.g)*t, b:c1.b+(c2.b-c1.b)*t};
}
function successColor(pct){
  const red = hexToRgb(cssVar('--red-ui','#e2543a'));
  const mid = hexToRgb(cssVar('--panel-accent','#ffb020'));
  const green = hexToRgb(cssVar('--green-ui','#6fe3a0'));
  const c = pct <= 50 ? lerpColor(red, mid, pct/50) : lerpColor(mid, green, (pct-50)/50);
  return rgbToHex(c.r, c.g, c.b);
}

// Threshold for a given area (in %), derived from maxErrors and the
// current card count in the area (not a fixed count — a set may have
// more questions than the exam board picks for the actual exam). Returns
// null if the area has no maxErrors — then the old smooth gradient is used.
function areaThresholdPct(cat){
  const maxErrors = AREA_MAX_ERRORS[cat];
  if(maxErrors == null) return null;
  const total = (DATA[cat] || []).length;
  if(!total) return null;
  return Math.max(0, (1 - maxErrors/total) * 100);
}

// Color with a threshold: fixed red below the threshold, logarithmic
// transition (orange→green) from the threshold to 100%. Without a
// threshold (thresholdPct === null) it behaves like the smooth 0-100% scale.
function successColorFor(pct, thresholdPct){
  if(thresholdPct == null) return successColor(pct);
  if(pct < thresholdPct) return 'hsl(0, 75%, 48%)'; // red, muted

  // From the threshold to 100%: logarithmic gradient from orange to green
  const span = 100 - thresholdPct;
  const normalized = span > 0 ? (pct - thresholdPct) / span : 1;
  const hue = logarithmicHue(normalized);
  return `hsl(${hue}, 75%, 50%)`;
}

// Distribution of cards into Leitner boxes 1-5 for a given area, optionally
// limited to one subarea. counts[i] = number of cards in box i+1.
function boxCounts(cat, group){
  const items = DATA[cat] || [];
  const counts = [0,0,0,0,0];
  let total = 0;
  items.forEach((it, i) => {
    if(group && group !== "__all__" && it.group !== group) return;
    counts[getBox(cat, i) - 1]++;
    total++;
  });
  return {counts, total};
}

// Weighted average box across cards, normalized to 0-100%
// (box1=0%, box5=100%) — a rough estimate of the exam success chance,
// used as input to the pass/fail dot's threshold color.
function weightedBoxPct(counts, total){
  if(!total) return 0;
  let sum = 0;
  counts.forEach((c, i) => { sum += c * (i/4*100); });
  return sum/total;
}

// HTML for the five bars (without the wrapping .box-bars) — color by box
// POSITION (box1 red .. box5 green), height by that box's share of cards.
// An empty box is still shown (minimum height), so all 5 are always visible.
// Constant colors: R, R-O, O, Y, G; muted (S=70-80%, L=48-52%)
function boxBarsInnerHtml(counts, total){
  const colors = ['hsl(0, 75%, 48%)', 'hsl(15, 80%, 48%)', 'hsl(30, 80%, 48%)', 'hsl(45, 75%, 50%)', 'hsl(90, 70%, 52%)'];
  let html = "";
  for(let i=0;i<5;i++){
    const frac = total ? counts[i]/total : 0;
    const heightPct = Math.max(8, Math.round(frac*100));
    const color = counts[i] === 0 ? cssVar('--border', '#2a3436') : colors[i];
    html += '<div class="box-bar" style="height:'+heightPct+'%;background:'+color+';" title="Box '+(i+1)+': '+counts[i]+'"></div>';
  }
  return html;
}
function boxBarsHtml(counts, total){
  return '<div class="box-bars">' + boxBarsInnerHtml(counts, total) + '</div>';
}

// Info for a given area's pass/fail dot, or null when the area has no
// maxErrors (then the dot isn't shown at all — see FORMAT.md).
function passDotInfo(cat){
  const threshold = areaThresholdPct(cat);
  if(threshold == null) return null;
  const {counts, total} = boxCounts(cat, "__all__");
  const pct = weightedBoxPct(counts, total);
  return {pct, color: successColorFor(pct, threshold)};
}
function passDotHtml(cat){
  const info = passDotInfo(cat);
  if(!info) return '<span class="pass-dot"></span>';
  return '<span class="pass-dot visible" style="background:'+info.color+';" title="'+Math.round(info.pct)+'%"></span>';
}

// Rough forgetting-curve estimate per card (Ebbinghaus/SM-2 shaped):
// "stability" is how many days it roughly takes for recall to fade,
// growing geometrically with the box (more boxes climbed = more durable)
// and shrunk by lapses relative to the CURRENT box. Dividing by the box
// (rather than keeping a flat lapse penalty) means old lapses matter less
// once the card has since climbed back up on its own — avoids the classic
// SM-2 "ease hell" of a card staying penalized forever after a rough start.
const URGENCY_BASE_INTERVAL_DAYS = 1;
const URGENCY_GROWTH_FACTOR = 2.2;
function cardStabilityDays(entry){
  const stability = URGENCY_BASE_INTERVAL_DAYS * Math.pow(URGENCY_GROWTH_FACTOR, entry.box - 1);
  return stability / (1 + entry.lapses / entry.box);
}
// 0 (just reviewed, fresh) .. 1 (long overdue, probably forgotten). A card
// with no lastSeen yet (never reviewed since this feature shipped) is
// treated as fully due, same as a brand-new card.
function cardUrgency(entry){
  if(!entry.lastSeen) return 1;
  const daysSince = (Date.now() - entry.lastSeen) / 86400000;
  const stability = cardStabilityDays(entry);
  return 1 - Math.exp(-daysSince / stability);
}
// Average urgency across an area/subarea's cards, fed through the same
// red→green gradient as the box-mastery colors, just inverted (urgent =
// red, fresh = green).
function areaUrgency(cat, group){
  const items = DATA[cat] || [];
  let sum = 0, n = 0;
  items.forEach((it, i) => {
    if(group && group !== "__all__" && it.group !== group) return;
    sum += cardUrgency(getEntry(cat, i));
    n++;
  });
  return n ? sum/n : 0;
}
// Discrete 3-step urgency indicator (colorblind-safe: level is shown by
// how many of the 3 marks are filled, not just by color): 1 filled = fresh
// (green), 2 = getting due (orange), 3 = overdue (red). Unfilled marks use
// the same neutral gray as an empty Leitner box.
function urgencyBarHtml(cat, group){
  const urgency = areaUrgency(cat, group);
  const pct = Math.round(urgency * 100);
  const level = urgency < 1/3 ? 1 : (urgency < 2/3 ? 2 : 3);
  const color = level === 1 ? cssVar('--green-ui','#6fe3a0') : level === 2 ? cssVar('--panel-accent','#ffb020') : cssVar('--red-ui','#e2543a');
  const neutral = cssVar('--border','#2a3436');
  let marks = "";
  for(let i=0;i<3;i++){
    const filled = i < level;
    // marks += '<span style="color:'+(filled?color:neutral)+';">'+(filled?'￭':'･')+'</span>';
    marks += '<span style="color:'+(filled?color:neutral)+';">'+(filled?'◼':'◻')+'</span>';
  }
  return '<span class="urgency-bar" title="'+t("urgency_title", {pct})+'">'+marks+'</span>';
}

function renderStats(){
  const container = document.getElementById("statsList");
  if(!container) return;
  let html = "";
  Object.keys(STATS_CAT_LABELS).forEach(cat => {
    const {counts, total} = boxCounts(cat, "__all__");
    html += '<div class="stats-cat" data-cat="'+cat+'" data-group="__all__">'
      + '<div class="stats-cat-head">'
      + urgencyBarHtml(cat, "__all__")
      + '<span class="stats-cat-name">'+STATS_CAT_LABELS[cat]+'</span>'
      + passDotHtml(cat)
      + boxBarsHtml(counts, total)
      + '</div></div>';
    (GROUP_ORDER[cat] || []).forEach(group => {
      const g = boxCounts(cat, group);
      const safeGroup = group.replace(/"/g, '&quot;');
      html += '<div class="stats-row" data-cat="'+cat+'" data-group="'+safeGroup+'">'
        + urgencyBarHtml(cat, group)
        + '<span class="stats-row-name">'+group+'</span>'
        + boxBarsHtml(g.counts, g.total)
        + '</div>';
    });
  });
  container.innerHTML = html;
}

document.getElementById("statsList").addEventListener("click", e => {
  const row = e.target.closest("[data-cat]");
  if(!row) return;
  setCategory(row.dataset.cat, row.dataset.group);
  announceCurrentState();
  document.querySelector(".wrap").scrollIntoView({behavior:"smooth", block:"start"});
});

// ============================================================
// Handsfree mode (TTS + Media Session control via Next/Prev Track)
// ============================================================
let drivingModeActive = false;
let silentAudioEl = null;
let wakeLockSentinel = null;

async function requestWakeLock(){
  if(!("wakeLock" in navigator)) return;
  try{
    wakeLockSentinel = await navigator.wakeLock.request("screen");
    wakeLockSentinel.addEventListener("release", () => { wakeLockSentinel = null; });
  }catch(e){
    wakeLockSentinel = null;
  }
}
function releaseWakeLock(){
  if(wakeLockSentinel){
    try{ wakeLockSentinel.release(); }catch(e){}
    wakeLockSentinel = null;
  }
}
document.addEventListener("visibilitychange", () => {
  if(drivingModeActive && document.visibilityState === "visible" && !wakeLockSentinel){
    requestWakeLock();
  }
  // Chrome on Android keeps running speechSynthesis for a background tab
  // only briefly (then throttles/kills it), so a card can get cut off
  // mid-sentence or resume oddly once foregrounded again. Backgrounding
  // also has no way to resume handsfree later (the driver isn't looking
  // at the screen to restart it), so just end the session outright,
  // including the silent keep-alive audio and wake lock.
  if(document.visibilityState === "hidden" && drivingModeActive){
    stopDrivingMode();
  }
});

function speakLang(text, lang, onDone){
  if(!("speechSynthesis" in window) || !text){
    if(onDone) onDone();
    return;
  }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    if(onDone){
      u.onend = onDone;
      u.onerror = onDone;
    }
    window.speechSynthesis.speak(u);
  }catch(e){
    if(onDone) onDone();
  }
}
// Plays an array of {text, lang} segments as a chain of consecutive
// utterances — a single SpeechSynthesisUtterance can't mix languages/voices
// within itself, so spelling in a different language (see
// buildSpeechSegments) has to go segment by segment.
function speakSequence(segments, onDoneAll){
  const list = (segments || []).filter(seg => seg && seg.text);
  function next(i){
    if(i >= list.length){ if(onDoneAll) onDoneAll(); return; }
    speakLang(list[i].text, list[i].lang, () => next(i+1));
  }
  next(0);
}

// Splits arbitrary text (front/back/frontTts/backTts, also an area or
// subarea name) into language segments for speakSequence according to {X}
// markers: content inside curly braces is spelled out letter by letter
// using the currently selected spelling alphabet (independent of both the
// set's language and the interface language); a marker with no single
// letter/digit inside (pure punctuation, e.g. "{-}" for a dash) is read
// literally as that character instead of being spelled out. Text OUTSIDE
// {X} markers is passed to TTS unchanged — an abbreviation like "FM" or
// "HAREC" is read by the TTS engine itself, however it manages; more
// utterances per word (e.g. one per letter) is noticeably slower and
// doesn't improve anything on mobile (the engine usually handles short
// ALL-CAPS abbreviations fine on its own), so there's no automatic
// safety net for unmarked text — anyone who wants reliable spelling
// uses {X}.
const MARKER_RE = /\{([^{}]*)\}/g;
function buildSpeechSegments(text, lang){
  if(!text) return [];
  const alphabet = spellLibrary[activeSpellId] || EN_SPELL;
  const raw = [];
  let pos = 0;
  let m;
  MARKER_RE.lastIndex = 0;
  while((m = MARKER_RE.exec(text))){
    if(m.index > pos) raw.push({text: text.slice(pos, m.index), lang});
    const marked = m[1];
    if(/[\p{L}\p{N}]/u.test(marked)){
      const spelled = Array.from(marked).map(ch => alphabet.letters[ch] || alphabet.letters[ch.toUpperCase()] || ch).join(" ");
      raw.push({text: spelled, lang: alphabet.lang});
    }else{
      raw.push({text: m[0], lang});
    }
    pos = m.index + m[0].length;
  }
  if(pos < text.length) raw.push({text: text.slice(pos), lang});
  const merged = [];
  raw.forEach(seg => {
    const last = merged[merged.length - 1];
    if(last && last.lang.toLowerCase() === seg.lang.toLowerCase()) last.text += seg.text;
    else merged.push({text: seg.text, lang: seg.lang});
  });
  return merged.filter(seg => seg.text);
}

function frontSpeechText(item){ return (item.frontTts || "").trim() || item.front; }
function backSpeechText(item){ return (item.backTts || "").trim() || item.back; }

function speakFront(){
  const item = currentItem();
  if(!item) return;
  const deckLang = (library[activeSetId] && library[activeSetId].language) || "cs-CZ";
  speakSequence(buildSpeechSegments(frontSpeechText(item), deckLang));
}
function speakBack(){
  const item = currentItem();
  if(!item) return;
  const deckLang = (library[activeSetId] && library[activeSetId].language) || "cs-CZ";
  speakSequence(buildSpeechSegments(backSpeechText(item), deckLang));
}
// Spoken instructional phrases in handsfree mode (not the card content)
// are now driven by the ACTIVE INTERFACE LANGUAGE (langLibrary/activeLangId)
// exactly like the GUI texts — via t() with the "spoken_" prefix; the
// built-in English + import of another pack (see Languages/*.json) covers
// both at once. The card content itself (front/back) is still read in the
// ACTIVE FLASHCARD SET's language — that's a separate, independent axis,
// see speakFront()/speakBack()/buildSpeechSegments(). Where an
// instructional phrase and card/set content get combined into one
// announcement (scopeSpokenSegments, speakFeedbackThenNext), they must be
// separate segments for speakSequence, so each part speaks in the correct
// voice/language (the same principle as spelling abbreviations in a
// different alphabet).
function sp(key){
  return t("spoken_" + key);
}
function activeSpokenLang(){
  const pack = langLibrary[activeLangId];
  return (pack && pack.langCode) || "en";
}

function announceCurrentState(){
  if(!drivingModeActive) return;
  const item = currentItem();
  if(!item){ speakLang(sp("round_done"), activeSpokenLang()); return; }
  if(state.flipped) speakBack(); else speakFront();
}

// Returns segments for speakSequence: the area/subarea name is CONTENT
// of the active flashcard set (the set's language, via the optional
// nameTts and {X} markers), while sp("whole_area") ("The whole area ")
// is an instructional phrase (interface language) — they must not go
// into a single utterance.
function scopeSpokenSegments(cat, group){
  const deckLang = (library[activeSetId] && library[activeSetId].language) || "cs-CZ";
  const areaSpoken = AREA_NAME_SPOKEN[cat] || STATS_CAT_LABELS[cat] || cat;
  if(group && group !== "__all__"){
    const groupSpoken = (SUBAREA_NAME_SPOKEN[cat] && SUBAREA_NAME_SPOKEN[cat][group]) || group;
    return buildSpeechSegments(areaSpoken + ", " + groupSpoken, deckLang);
  }
  return [{text: sp("whole_area"), lang: activeSpokenLang()}, ...buildSpeechSegments(areaSpoken, deckLang)];
}
// Plain text for non-spoken display (Media Session metadata) — mixing
// languages in one string doesn't matter there, since nothing reads it aloud.
function scopeSpokenLabel(cat, group){
  const catName = STATS_CAT_LABELS[cat] || cat;
  return (group && group !== "__all__") ? (catName + ", " + group) : (sp("whole_area") + catName);
}

function allSubgroupScopes(){
  const scopes = [];
  Object.keys(CAT_LABELS).forEach(cat => {
    (GROUP_ORDER[cat] || []).forEach(g => scopes.push({cat, group: g}));
  });
  return scopes;
}
function allCategoryScopes(){
  return Object.keys(CAT_LABELS).map(cat => ({cat, group: "__all__"}));
}

function advanceScope(){
  if(state.group === "__all__"){
    const scopes = allCategoryScopes();
    const i = scopes.findIndex(s => s.cat === state.cat && s.group === "__all__");
    const next = scopes[(i + 1) % scopes.length];
    setCategory(next.cat, next.group);
  }else{
    const scopes = allSubgroupScopes();
    const i = scopes.findIndex(s => s.cat === state.cat && s.group === state.group);
    const next = scopes[(i + 1) % scopes.length];
    setCategory(next.cat, next.group);
  }
  updateDrivingMetadata();
}

function updateDrivingMetadata(){
  if(!drivingModeActive || !("mediaSession" in navigator)) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: scopeSpokenLabel(state.cat, state.group),
      artist: "OK Trainer — " + (library[activeSetId] ? library[activeSetId].shortName : "")
    });
  }catch(e){}
}

function speakFeedbackThenNext(feedbackText){
  const next = currentItem();
  const deckLang = (library[activeSetId] && library[activeSetId].language) || "cs-CZ";
  const nextSegs = next ? buildSpeechSegments(frontSpeechText(next), deckLang) : [{text: sp("round_done"), lang: activeSpokenLang()}];
  speakSequence([{text: feedbackText, lang: activeSpokenLang()}, ...nextSegs]);
}

function drivingNext(){
  if(!currentItem()){
    advanceScope();
    const segs = [{text: sp("next_selection"), lang: activeSpokenLang()}, ...scopeSpokenSegments(state.cat, state.group)];
    segs[segs.length - 1].text += ".";
    speakSequence(segs, speakFront);
    return;
  }
  if(!state.flipped){
    flip();
    speakBack();
  }else{
    grade(true);
    speakFeedbackThenNext(sp("know"));
  }
}

function drivingPrev(){
  if(!currentItem()){
    state.sessionGood = 0; state.sessionBad = 0;
    buildDeck();
    renderCard();
    speakLang(sp("selection_restarted"), activeSpokenLang(), speakFront);
    return;
  }
  if(!state.flipped){
    speakLang(sp("reading_again"), activeSpokenLang(), speakFront);
  }else{
    grade(false);
    speakFeedbackThenNext(sp("dont_know"));
  }
}

function startDrivingMode(){
  if(!("speechSynthesis" in window) || !("mediaSession" in navigator)){
    alert(t("err_no_speech_support"));
    return;
  }

  if(!silentAudioEl){
    silentAudioEl = new Audio("keepalive.wav");
    silentAudioEl.loop = true;
    // The sound has to actively play for the app to get audio focus at all
    // (without a playing <audio> element the Media Session API doesn't
    // work on Android). Verified on a real device: volume = 0 knocks the
    // app out of audio focus entirely, while any nonzero value works —
    // 0.00001 is practically inaudible. Reliability with the screen off is
    // handled by the Wake Lock below, not the volume.
    silentAudioEl.volume = 0.00001;
  }
  silentAudioEl.play().catch(() => {});
  requestWakeLock();

  const actions = {
    "nexttrack": drivingNext,
    "previoustrack": drivingPrev,
    "seekforward": drivingNext,
    "seekbackward": drivingPrev,
    "play": () => {},
    "pause": () => {},
    "stop": stopDrivingMode,
  };
  Object.keys(actions).forEach(name => {
    try{ navigator.mediaSession.setActionHandler(name, actions[name]); }catch(e){}
  });
  navigator.mediaSession.playbackState = "playing";

  drivingModeActive = true;
  // Handsfree always starts with the question — if the card was flipped
  // to the answer (e.g. from previous manual practice), flip it back so
  // what the app says (speakFront below) matches what's shown on screen,
  // and a user relying purely on hearing knows what they're answering.
  if(state.flipped){
    state.flipped = false;
    renderCard();
  }
  updateDrivingMetadata();
  const btn = document.getElementById("btnDriving");
  if(btn){ btn.textContent = t("driving_stop"); btn.classList.add("active"); }

  const modeSegs = [{text: sp("mode_active"), lang: activeSpokenLang()}, ...scopeSpokenSegments(state.cat, state.group)];
  modeSegs[modeSegs.length - 1].text += ".";
  speakSequence(modeSegs, speakFront);
}

function stopDrivingMode(){
  drivingModeActive = false;
  releaseWakeLock();
  if(silentAudioEl){ silentAudioEl.pause(); }
  try{
    ["nexttrack","previoustrack","seekforward","seekbackward","play","pause","stop"].forEach(name => {
      try{ navigator.mediaSession.setActionHandler(name, null); }catch(e){}
    });
    navigator.mediaSession.playbackState = "none";
  }catch(e){}
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
  const btn = document.getElementById("btnDriving");
  if(btn){ btn.textContent = t("driving_start"); btn.classList.remove("active"); }
}

document.getElementById("btnDriving") && document.getElementById("btnDriving").addEventListener("click", () => {
  if(drivingModeActive) stopDrivingMode(); else startDrivingMode();
});

// ============================================================
// Controls
// ============================================================
document.getElementById("areaSelect").addEventListener("change", e => {
  setCategory(e.target.value);
  announceCurrentState();
});
document.getElementById("subgroupSelect").addEventListener("change", e => {
  setGroup(e.target.value);
  announceCurrentState();
});
document.getElementById("card").addEventListener("click", () => {
  flip();
  announceCurrentState();
});
document.getElementById("btnGood").addEventListener("click", () => {
  grade(true);
  announceCurrentState();
});
document.getElementById("btnBad").addEventListener("click", () => {
  grade(false);
  announceCurrentState();
});
document.getElementById("btnResetScope").addEventListener("click", () => {
  const scope = hasGroups(state.cat) && state.group !== "__all__" ? state.group : CAT_LABELS[state.cat];
  if(!confirm(t("confirm_reset_scope", {scope, setId: activeSetId}))) return;
  const items = DATA[state.cat] || [];
  items.forEach((it, i) => {
    if(state.group === "__all__" || it.group === state.group){
      delete progress[cardKey(state.cat, i)];
    }
  });
  saveProgress();
  state.sessionGood = 0; state.sessionBad = 0;
  buildDeck(); renderCard(); renderStats();
  announceCurrentState();
});
document.getElementById("btnResetAll").addEventListener("click", () => {
  if(!confirm(t("confirm_reset_all", {setId: activeSetId}))) return;
  progress = {};
  saveProgress();
  state.sessionGood = 0; state.sessionBad = 0;
  buildDeck(); renderCard(); renderStats();
  announceCurrentState();
});
document.getElementById("onlyHard").addEventListener("change", () => {
  state.sessionGood = 0; state.sessionBad = 0;
  buildDeck(); renderCard();
  announceCurrentState();
});
document.addEventListener("keydown", e => {
  if(e.code === "Space"){ e.preventDefault(); flip(); announceCurrentState(); }
  else if(e.code === "ArrowRight" && state.flipped){ grade(true); announceCurrentState(); }
  else if(e.code === "ArrowLeft" && state.flipped){ grade(false); announceCurrentState(); }
  else if(drivingModeActive){
    if(e.key === "MediaTrackNext"){ drivingNext(); }
    else if(e.key === "MediaTrackPrevious"){ drivingPrev(); }
  }
});

if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    updateHeaderProgress();
    renderStats();
  });
}

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

// ============================================================
// Settings screen (interface language / card set / spelling
// alphabet) — visibility toggled via .hidden, no real navigation,
// the app is still a single page.
// ============================================================
document.getElementById("btnOpenSettings").addEventListener("click", () => {
  document.getElementById("mainScreen").classList.add("hidden");
  document.getElementById("settingsScreen").classList.remove("hidden");
});
document.getElementById("btnCloseSettings").addEventListener("click", () => {
  document.getElementById("settingsScreen").classList.add("hidden");
  document.getElementById("mainScreen").classList.remove("hidden");
});

// ============================================================
// Initialization
// ============================================================
switchToSet(activeSetId);
applyTranslations();
renderSpellSelect();
</script>
