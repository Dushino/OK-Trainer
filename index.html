<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OK Trainer</title>
<meta name="theme-color" content="#eee8d9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12181a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OK Trainer">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --chassis:#12181a;
    --panel:#1b2426;
    --panel-2:#212c2e;
    --border:#2a3436;
    --text:#eae6d9;
    --text-muted:#8b9a95;
    --panel-accent:#ffb020;
    --panel-accent-dim:#8a6a2c;
    --green-ui:#6fe3a0;
    --green-dim-ui:#2f5c48;
    --red-ui:#e2543a;
    --red-dim-ui:#6b2f26;

    --lcd:#0c1a17;
    --lcd-border:#324442;
    --lcd-text:#eae6d9;
    --lcd-muted:#8b9a95;
    --amber:#ffb020;
    --green:#6fe3a0;
    --red:#e2543a;

    --mono: ui-monospace, Menlo, Consolas, "Cascadia Code", "SF Mono", "Courier New", monospace;
    --serif: Georgia, "Times New Roman", serif;
    --sans: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{
      --chassis:#eee8d9;
      --panel:#ffffff;
      --panel-2:#efe8d6;
      --border:#d9d2bd;
      --text:#2b2a25;
      --text-muted:#6b6558;
      --panel-accent:#a85d00;
      --panel-accent-dim:#d9b27a;
      --green-ui:#1f8a5c;
      --green-dim-ui:#8fc7ac;
      --red-ui:#c23b26;
      --red-dim-ui:#e3a89a;
      --lcd:#ffffff;
      --lcd-border:#d9d2bd;
      --lcd-text:#2b2a25;
      --lcd-muted:#948c78;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--chassis);
    color:var(--text);
    font-family:var(--sans);
    font-feature-settings: "zero" 1, "ss01" 1;
    min-height:100vh;
    padding:24px 16px 60px;
    display:flex;
    justify-content:center;
  }
  .wrap{width:100%;max-width:640px;}
  header{margin-bottom:18px;text-align:center;}
  .callsign{
    font-family:var(--serif);
    font-size:26px;
    letter-spacing:2px;
    color:var(--panel-accent);
    margin:0 0 4px;
  }
  .sub{
    font-family:var(--sans);
    font-size:12px;
    color:var(--text-muted);
    letter-spacing:0.5px;
    padding:0 8px;
  }

  .set-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin:20px 0 10px;
  }
  .set-row .selectbar{
    flex:1;
    min-width:0;
  }
  .selectbar{
    position:relative;
  }
  .selectbar select{
    width:100%;
    font-family:var(--sans);
    font-size:13px;
    padding:10px 12px;
    padding-right:28px;
    background:var(--panel);
    color:var(--panel-accent);
    border:1px solid var(--border);
    border-radius:8px;
    appearance:none;
    -webkit-appearance:none;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .selectbar::after{
    content:"▾";
    position:absolute;
    right:16px;
    top:12px;
    color:var(--text-muted);
    font-size:12px;
    pointer-events:none;
  }
  .icon-btn{
    flex-shrink:0;
    width:40px;
    height:40px;
    font-size:16px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    cursor:pointer;
    color:var(--text);
  }
  .icon-btn:hover{background:var(--panel-2);}
  .icon-btn:disabled{opacity:0.3;cursor:default;}

  #areaSelectBar{
    margin:0 0 10px;
  }
  .subgroupbar{
    margin-bottom:14px;
    display:none;
  }
  .subgroupbar.visible{display:block;}
  .statbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .counts{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-muted);
    display:flex;
    gap:14px;
  }
  .counts b{color:var(--text);font-weight:600;}
  .counts .ok{color:var(--green-ui);}
  .counts .bad{color:var(--red-ui);}
  .header-progress{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .header-progress .box-bars{width:45px;height:22px;}
  .card{
    background:var(--lcd);
    border:2px solid var(--lcd-border);
    border-radius:12px;
    min-height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px 24px;
    cursor:pointer;
    user-select:none;
    position:relative;
  }
  .card .tag{
    position:absolute;
    top:12px;
    left:16px;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:1px;
    color:var(--lcd-muted);
    text-transform:uppercase;
    max-width:70%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .card .hint{
    position:absolute;
    bottom:12px;
    right:16px;
    font-family:var(--mono);
    font-size:10px;
    color:var(--lcd-muted);
  }
  .card .face{
    font-family:var(--serif);
    font-size:20px;
    line-height:1.5;
    color:var(--lcd-text);
  }
  .card.flipped .face{
    font-family:var(--mono);
    font-feature-settings:"zero" 1;
    font-variant-numeric:slashed-zero;
    font-size:24px;
    color:var(--panel-accent);
    font-weight:600;
  }
  .answer-zero{
    display:inline-block;
    overflow:hidden;
    position:relative;
  }
  .answer-zero::after{
    background:currentColor;
    content:"";
    height:82%;
    left:50%;
    position:absolute;
    top:9%;
    transform:translateX(-50%) rotate(25deg);
    width:1.5px;
  }
  .card.done{
    color:var(--green-ui);
  }
  .controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:16px;
  }
  .controls button{
    font-family:var(--sans);
    font-size:14px;
    font-weight:600;
    padding:14px 10px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid;
  }
  #btnBad{
    background:transparent;
    color:var(--red-ui);
    border-color:var(--red-dim-ui);
  }
  #btnBad:hover{background:rgba(226,84,58,0.1);}
  #btnGood{
    background:transparent;
    color:var(--green-ui);
    border-color:var(--green-dim-ui);
  }
  #btnGood:hover{background:rgba(111,227,160,0.1);}
  .controls button:disabled{opacity:0.35;cursor:default;}
  .driving-row{
    margin-top:14px;
    text-align:center;
  }
  .driving-btn{
    width:100%;
    font-family:var(--sans);
    font-size:14px;
    font-weight:600;
    padding:12px 10px;
    border-radius:8px;
    cursor:pointer;
    background:transparent;
    color:var(--panel-accent);
    border:1px solid var(--panel-accent-dim);
  }
  .driving-btn:hover{background:rgba(255,176,32,0.08);}
  .driving-btn.active{
    background:var(--panel-accent);
    color:var(--chassis);
    border-color:var(--panel-accent);
  }
  .driving-hint{
    margin:8px 0 0;
    font-family:var(--mono);
    font-size:10.5px;
    line-height:1.5;
    color:var(--text-muted);
  }
  .toolbar{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:18px;
    flex-wrap:wrap;
    gap:10px;
  }
  .toolbar label{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .reset-row{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:24px;
  }
  .reset-btn{
    font-family:var(--sans);
    font-size:12px;
    font-weight:600;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    background:transparent;
    color:var(--red-ui);
    border:1px solid var(--red-dim-ui);
  }
  .reset-btn:hover{background:rgba(226,84,58,0.08);}
  .keys{
    margin-top:22px;
    text-align:center;
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-muted);
  }
  .keys kbd{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:4px;
    padding:1px 6px;
    color:var(--text);
  }
  .stats{margin-top:30px;}
  .stats-title{
    font-family:var(--serif);
    font-size:15px;
    color:var(--text-muted);
    text-align:center;
    letter-spacing:1px;
    margin:0 0 12px;
  }
  .stats-cat{
    margin-top:16px;
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
  }
  .stats-cat:first-child{margin-top:0;}
  .stats-cat:hover{background:var(--panel);}
  .stats-cat-head{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .stats-cat-name{
    flex:1;
    font-family:var(--serif);
    font-size:16px;
    font-weight:700;
    color:var(--text);
  }
  .box-bars{
    display:flex;
    align-items:flex-end;
    gap:2px;
    width:40px;
    height:20px;
    flex-shrink:0;
  }
  .stats-cat .box-bars{width:50px;height:24px;}
  .box-bar{
    flex:1;
    min-width:2px;
    border-radius:1px 1px 0 0;
    background:var(--border);
  }
  .pass-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    flex-shrink:0;
    display:none;
  }
  .pass-dot.visible{display:inline-block;}
  .stats-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:5px 10px 5px 22px;
    border-radius:6px;
    cursor:pointer;
  }
  .stats-row:hover{background:var(--panel);}
  .stats-row-name{
    flex:1;
    font-family:var(--sans);
    font-size:13px;
    color:var(--text-muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  footer a{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-muted);
    text-decoration:none;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="callsign">OK TRAINER</p>
    <p class="sub" id="subLabel">…</p>
  </header>

  <div class="set-row">
    <div class="selectbar">
      <select id="langSelect"></select>
    </div>
    <button id="btnImportLang" class="icon-btn" data-i18n-title="import_lang_title">📥</button>
    <button id="btnDeleteLang" class="icon-btn" data-i18n-title="delete_lang_title">🗑️</button>
    <input type="file" id="fileImportLangInput" accept="application/json,.json" style="display:none;">
  </div>

  <div class="set-row">
    <div class="selectbar">
      <select id="setSelect"></select>
    </div>
    <button id="btnImportSet" class="icon-btn" data-i18n-title="import_set_title">📥</button>
    <button id="btnDeleteSet" class="icon-btn" data-i18n-title="delete_set_title">🗑️</button>
    <input type="file" id="fileImportInput" accept="application/json,.json" style="display:none;">
  </div>

  <div class="selectbar" id="areaSelectBar">
    <select id="areaSelect"></select>
  </div>

  <div class="selectbar subgroupbar" id="subgroupbar">
    <select id="subgroupSelect"></select>
  </div>

  <div class="statbar">
    <div class="counts">
      <span><span data-i18n="remaining"></span> <b id="cntLeft">0</b></span>
    </div>
    <div class="header-progress" id="headerProgress">
      <span class="pass-dot" id="headerDot"></span>
      <div class="box-bars" id="headerBoxBars"></div>
    </div>
  </div>

  <div class="card" id="card">
    <span class="tag" id="cardTag">—</span>
    <div class="face" id="cardFace">…</div>
    <span class="hint" id="cardHint" data-i18n="tap_to_flip"></span>
  </div>

  <div class="controls">
    <button id="btnBad" disabled data-i18n="btn_dont_know"></button>
    <button id="btnGood" disabled data-i18n="btn_know"></button>
  </div>

  <div class="driving-row">
    <button id="btnDriving" class="driving-btn" data-i18n="driving_start"></button>
    <p class="driving-hint" id="drivingHint" data-i18n="driving_hint"></p>
  </div>

  <div class="toolbar">
    <label><input type="checkbox" id="onlyHard"> <span data-i18n="only_hard"></span></label>
  </div>

  <p class="keys">
    <kbd data-i18n="key_space"></kbd> <span data-i18n="key_flip"></span> &nbsp; <kbd>←</kbd> <span data-i18n="key_dont_know"></span> &nbsp; <kbd>→</kbd> <span data-i18n="key_know"></span>
  </p>

  <section class="stats">
    <p class="stats-title" data-i18n="stats_title"></p>
    <div id="statsList"></div>
  </section>

  <div class="reset-row">
    <button id="btnResetScope" class="reset-btn" data-i18n="reset_scope_btn"></button>
    <button id="btnResetAll" class="reset-btn" data-i18n="reset_all_btn"></button>
  </div>

  <footer style="margin-top:28px;text-align:center;">
    <a href="https://github.com/Dushino/OK-Trainer" target="_blank" rel="noopener" id="footerLink">https://github.com/Dushino/OK-Trainer</a>
  </footer>
</div>

<script>
// ============================================================
// Vestavěná výuková sada — zároveň funguje jako ukázka formátu.
// ============================================================
const TUTORIAL_SET = {
  "shortName": "Tutorial",
  "longName": "Sample set — how to use OK Trainer",
  "language": "en-US",
  "areas": [
    {
      "name": "Basics",
      "subareas": [
        {
          "name": "Flashcards",
          "cards": [
            { "front": "How do you flip a card to see the answer?", "back": "Tap the card, or press the space bar." },
            { "front": "What does the color of the bar in the statistics mean?", "back": "Red = poor results, orange = somewhere in between, green = you know it reliably." }
          ]
        },
        {
          "name": "Groups and selection",
          "cards": [
            { "front": "How are the questions organized?", "back": "Into areas and subareas — pick an area at the top, then a specific subarea below it, or \"all\"." },
            { "front": "What does the \"reset stats for selected (sub)area\" button do?", "back": "It resets the saved success rate for that (sub)area; the card content stays unchanged." }
          ]
        }
      ]
    },
    {
      "name": "Advanced features",
      "subareas": [
        {
          "name": "Handsfree mode",
          "cards": [
            { "front": "What does the 🎧 \"Start handsfree mode\" button do?", "back": "It turns on voice reading of the cards, controlled with the Next/Previous track buttons on your headset or watch." },
            { "front": "How do you hear the question again?", "back": "Press Prev/Previous track while the card is still showing its front side." }
          ]
        },
        {
          "name": "Custom question sets",
          "cards": [
            { "front": "Where do the questions come from?", "back": "From an imported JSON file — you can create your own set." },
            { "front": "What happens if you import a set with the same short name as one that's already imported?", "back": "All statistics for that set will be reset." }
          ]
        }
      ]
    }
  ]
};
// ============================================================
// Jazyk rozhraní (GUI) — vestavěná angličtina + import dalších
// balíčků stejným způsobem jako u sad kartiček.
// ============================================================
const EN_STRINGS = {
  import_set_title: "Import set",
  delete_set_title: "Delete set",
  import_lang_title: "Import language",
  delete_lang_title: "Delete language",
  remaining: "remaining",
  tap_to_flip: "tap to flip",
  tap_to_flip_back: "tap to flip back",
  round_done: "Round complete ✓ — tap for a new round",
  btn_dont_know: "✗ Don't know",
  btn_know: "✓ Know",
  driving_start: "🎧  Start handsfree mode",
  driving_stop: "🎧  Stop handsfree mode",
  driving_hint: "TTS reads the card aloud, then control it with the Next/Prev buttons on your headset, watch or in the car. The screen stays on to keep the audio session alive — dim it manually before you drive.",
  only_hard: "hard cards only",
  key_space: "space",
  key_flip: "flip",
  key_dont_know: "don't know",
  key_know: "know",
  stats_title: "Success statistics",
  reset_scope_btn: "🔄 reset stats for selected area",
  reset_all_btn: "🗑️ reset all stats for this set",
  all_prefix: "All —",
  err_invalid_json: "Could not read the file as valid JSON:\n{msg}",
  err_invalid_structure: "The file has an invalid structure:\n\n{errs}",
  confirm_reimport: "The set \"{name}\" already exists in the app.\n\nImporting will replace its content and RESET the existing stats for this set. Continue?",
  confirm_delete_set: "Really delete the set \"{name}\" including all its stats? This cannot be undone.",
  confirm_reset_scope: "Reset stats and saved progress for \"{scope}\" (set \"{setId}\")?",
  confirm_reset_all: "Really reset ALL stats and saved progress for the whole set \"{setId}\"? This cannot be undone.",
  confirm_delete_lang: "Really delete the \"{name}\" language pack? English will be used instead.",
  err_no_speech_support: "This browser doesn't support speech synthesis or media-key control.",
  val_not_object: "The file is not a valid JSON object.",
  val_missing_field: "Missing text field \"{field}\".",
  val_missing_language: "Missing text field \"language\" (e.g. \"en-US\").",
  val_no_areas: "Missing non-empty \"areas\" array.",
  val_too_many_areas: "Too many areas (max {max}, found {n}).",
  val_area_label: "Area #{n}",
  val_subarea_label: "{area} → subarea #{n}",
  val_no_name: "{label} has no valid \"name\" field.",
  val_no_subareas: "{label} has no non-empty \"subareas\" array.",
  val_too_many_subareas: "{label} has too many subareas (max {max}, found {n}).",
  val_no_cards: "{label} has no non-empty \"cards\" array.",
  val_card_no_front: "{label} → card #{n} has no valid \"front\" field.",
  val_card_no_back: "{label} → card #{n} has no valid \"back\" field."
};
const BUILTIN_LANG_ID = "en";

const LANG_LIB_KEY = "oktrainer_langlib_v1";
const ACTIVE_LANG_KEY = "oktrainer_activelang_v1";

function loadLangLibrary(){
  try{
    const raw = localStorage.getItem(LANG_LIB_KEY);
    const lib = raw ? JSON.parse(raw) : {};
    if(!lib[BUILTIN_LANG_ID]) lib[BUILTIN_LANG_ID] = {langCode: "en", langName: "English", strings: EN_STRINGS};
    return lib;
  }catch(e){
    return {[BUILTIN_LANG_ID]: {langCode: "en", langName: "English", strings: EN_STRINGS}};
  }
}
function saveLangLibrary(){
  try{ localStorage.setItem(LANG_LIB_KEY, JSON.stringify(langLibrary)); }catch(e){}
}

let langLibrary = loadLangLibrary();
let activeLangId = localStorage.getItem(ACTIVE_LANG_KEY) || BUILTIN_LANG_ID;
if(!langLibrary[activeLangId]) activeLangId = BUILTIN_LANG_ID;

// t(key, vars) - přeloží klíč v aktivním jazyce; chybějící klíč spadne
// zpátky na vestavěnou angličtinu, ať import neúplného balíčku appku nikdy
// nerozbije.
function t(key, vars){
  const pack = langLibrary[activeLangId];
  let s = (pack && pack.strings && pack.strings[key]) || EN_STRINGS[key] || key;
  if(vars) Object.keys(vars).forEach(k => { s = s.split("{" + k + "}").join(String(vars[k])); });
  return s;
}

function validateLangPack(obj){
  const errs = [];
  if(!obj || typeof obj !== "object"){ errs.push(t("val_not_object")); return errs; }
  if(!obj.langCode || typeof obj.langCode !== "string") errs.push(t("val_missing_field", {field: "langCode"}));
  if(!obj.langName || typeof obj.langName !== "string") errs.push(t("val_missing_field", {field: "langName"}));
  if(!obj.strings || typeof obj.strings !== "object") errs.push(t("val_missing_field", {field: "strings"}));
  return errs;
}

function renderLangSelect(){
  const sel = document.getElementById("langSelect");
  const ids = Object.keys(langLibrary).sort((a,b) => a === BUILTIN_LANG_ID ? -1 : b === BUILTIN_LANG_ID ? 1 : a.localeCompare(b));
  sel.innerHTML = ids.map(id => '<option value="' + id.replace(/"/g,'&quot;') + '">' + langLibrary[id].langName + '</option>').join("");
  sel.value = activeLangId;
  document.getElementById("btnDeleteLang").disabled = (activeLangId === BUILTIN_LANG_ID);
}

function applyTranslations(){
  document.documentElement.lang = activeLangId;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  document.querySelectorAll("[data-i18n-title]").forEach(el => {
    el.title = t(el.getAttribute("data-i18n-title"));
  });
  const drivingBtn = document.getElementById("btnDriving");
  if(drivingBtn) drivingBtn.textContent = drivingModeActive ? t("driving_stop") : t("driving_start");
  renderLangSelect();
  if(Object.keys(CAT_LABELS).length){
    renderSubgroupBar();
    renderCard();
    renderStats();
  }
}

function switchToLang(id){
  if(!langLibrary[id]) return;
  activeLangId = id;
  try{ localStorage.setItem(ACTIVE_LANG_KEY, id); }catch(e){}
  applyTranslations();
}

const BUILTIN_ID = TUTORIAL_SET.shortName;
const MAX_AREAS = 100;
const MAX_SUBAREAS = 1000;

// ============================================================
// Úložiště: knihovna sad + postup/statistiky vázané na aktivní sadu
// ============================================================
const LIB_KEY = "oktrainer_library_v1";
const ACTIVE_KEY = "oktrainer_active_v1";

function loadLibrary(){
  try{
    const raw = localStorage.getItem(LIB_KEY);
    const lib = raw ? JSON.parse(raw) : {};
    if(!lib[BUILTIN_ID]) lib[BUILTIN_ID] = TUTORIAL_SET;
    return lib;
  }catch(e){
    return {[BUILTIN_ID]: TUTORIAL_SET};
  }
}
function saveLibrary(){
  try{ localStorage.setItem(LIB_KEY, JSON.stringify(library)); }catch(e){}
}

function progressKey(id){ return "oktrainer_progress_v1__" + id; }
function navKey(id){ return "oktrainer_lastnav_v1__" + id; }

function loadProgressFor(id){
  try{
    const raw = localStorage.getItem(progressKey(id));
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(){
  try{ localStorage.setItem(progressKey(activeSetId), JSON.stringify(progress)); }catch(e){}
}
function wipeSetData(id){
  try{
    localStorage.removeItem(progressKey(id));
    localStorage.removeItem(navKey(id));
  }catch(e){}
}

let library = loadLibrary();
let activeSetId = localStorage.getItem(ACTIVE_KEY) || BUILTIN_ID;
if(!library[activeSetId]) activeSetId = BUILTIN_ID;

let progress = {};

// DATA / GROUP_ORDER / CAT_LABELS jsou sestaveny dynamicky z aktivní sady
// při každém přepnutí — vše ostatní v apce (boxy, míchání, statistiky,
// handsfree) pracuje s "cat" jen jako s obecným klíčem, stejně jako dřív.
let DATA = {};
let GROUP_ORDER = {};
let CAT_LABELS = {};
let STATS_CAT_LABELS = {};
let AREA_MAX_ERRORS = {};

function applyActiveSet(setObj){
  DATA = {}; GROUP_ORDER = {}; CAT_LABELS = {}; STATS_CAT_LABELS = {}; AREA_MAX_ERRORS = {};
  setObj.areas.forEach((area, ai) => {
    const key = String(ai);
    CAT_LABELS[key] = area.name.toUpperCase();
    STATS_CAT_LABELS[key] = area.name;
    GROUP_ORDER[key] = area.subareas.map(sa => sa.name);
    AREA_MAX_ERRORS[key] = Number.isFinite(area.maxErrors) ? area.maxErrors : null;
    DATA[key] = [];
    area.subareas.forEach(sa => {
      sa.cards.forEach(c => {
        DATA[key].push([c.front, c.back, sa.name]);
      });
    });
  });
}

// ============================================================
// Validace importovaného souboru
// ============================================================
function validateSet(obj){
  const errs = [];
  if(!obj || typeof obj !== "object"){ errs.push(t("val_not_object")); return errs; }
  if(!obj.shortName || typeof obj.shortName !== "string") errs.push(t("val_missing_field", {field: "shortName"}));
  if(!obj.longName || typeof obj.longName !== "string") errs.push(t("val_missing_field", {field: "longName"}));
  if(!obj.language || typeof obj.language !== "string") errs.push(t("val_missing_language"));
  if(!Array.isArray(obj.areas) || obj.areas.length === 0){
    errs.push(t("val_no_areas"));
    return errs;
  }
  if(obj.areas.length > MAX_AREAS) errs.push(t("val_too_many_areas", {max: MAX_AREAS, n: obj.areas.length}));
  obj.areas.forEach((area, ai) => {
    const label = t("val_area_label", {n: ai+1}) + (area && area.name ? " (\"" + area.name + "\")" : "");
    if(!area || !area.name || typeof area.name !== "string") errs.push(t("val_no_name", {label}));
    if(!area || !Array.isArray(area.subareas) || area.subareas.length === 0){
      errs.push(t("val_no_subareas", {label}));
      return;
    }
    if(area.subareas.length > MAX_SUBAREAS) errs.push(t("val_too_many_subareas", {label, max: MAX_SUBAREAS, n: area.subareas.length}));
    area.subareas.forEach((sa, si) => {
      const slabel = t("val_subarea_label", {area: label, n: si+1}) + (sa && sa.name ? " (\"" + sa.name + "\")" : "");
      if(!sa || !sa.name || typeof sa.name !== "string") errs.push(t("val_no_name", {label: slabel}));
      if(!sa || !Array.isArray(sa.cards) || sa.cards.length === 0){
        errs.push(t("val_no_cards", {label: slabel}));
        return;
      }
      sa.cards.forEach((c, ci) => {
        if(!c || typeof c.front !== "string" || !c.front) errs.push(t("val_card_no_front", {label: slabel, n: ci+1}));
        if(!c || typeof c.back !== "string" || !c.back) errs.push(t("val_card_no_back", {label: slabel, n: ci+1}));
      });
    });
  });
  return errs;
}

// ============================================================
// Leitnerovy "boxy" (řízení opakování) — vázané na aktivní sadu
// ============================================================
function cardKey(cat, idx){ return cat + ":" + idx; }
function getBox(cat, idx){
  return progress[cardKey(cat, idx)] || 1;
}
function setBox(cat, idx, box){
  progress[cardKey(cat, idx)] = Math.max(1, Math.min(5, box));
  saveProgress();
}

// ============================================================
// Stav aktuálního kola
// ============================================================
let state = {
  cat: "0",
  group: "__all__",
  deck: [],
  pos: 0,
  flipped: false,
  sessionGood: 0,
  sessionBad: 0
};

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// Sestaví pořadí kartiček tak, aby se stejná kartička nikdy neobjevila
// dvakrát za sebou, ale zachovalo se procentuální zastoupení podle
// Leitnerova boxu (greedy podle zbývajícího počtu).
function buildNoAdjacentSequence(countsObj){
  let items = Object.keys(countsObj).map(k => ({idx: Number(k), count: countsObj[k]}));
  const total = items.reduce((a,b) => a + b.count, 0);
  let result = [];
  let last = null;
  while(result.length < total){
    let candidates = items.filter(i => i.count > 0 && i.idx !== last);
    if(candidates.length === 0){
      candidates = items.filter(i => i.count > 0);
    }
    const maxCount = Math.max(...candidates.map(c => c.count));
    const top = candidates.filter(c => c.count === maxCount);
    const choice = top[Math.floor(Math.random() * top.length)];
    result.push(choice.idx);
    choice.count--;
    last = choice.idx;
  }
  return result;
}

function hasGroups(cat){
  return !!GROUP_ORDER[cat];
}

function renderSubgroupBar(){
  const bar = document.getElementById("subgroupbar");
  const sel = document.getElementById("subgroupSelect");
  if(!hasGroups(state.cat)){
    bar.classList.remove("visible");
    return;
  }
  bar.classList.add("visible");
  const groups = GROUP_ORDER[state.cat];
  const label = t("all_prefix") + " " + (STATS_CAT_LABELS[state.cat] || "");
  let html = '<option value="__all__">' + label + '</option>';
  groups.forEach(g => {
    html += '<option value="' + g.replace(/"/g,'&quot;') + '">' + g + '</option>';
  });
  sel.innerHTML = html;
  sel.value = state.group;
}

function buildDeck(){
  const items = DATA[state.cat] || [];
  const onlyHard = document.getElementById("onlyHard").checked;
  let indices = items.map((_, i) => i);
  if(hasGroups(state.cat) && state.group !== "__all__"){
    indices = indices.filter(i => items[i][2] === state.group);
  }
  if(onlyHard){
    const filteredByHard = indices.filter(i => getBox(state.cat, i) <= 2);
    if(filteredByHard.length > 0) indices = filteredByHard;
  }
  const counts = {};
  indices.forEach(i => {
    const box = getBox(state.cat, i);
    counts[i] = Math.max(1, 6 - box);
  });
  state.deck = Object.keys(counts).length ? buildNoAdjacentSequence(counts) : [];
  state.pos = 0;
  state.flipped = false;
}

function currentItem(){
  const items = DATA[state.cat] || [];
  if(state.pos >= state.deck.length) return null;
  const idx = state.deck[state.pos];
  return {idx, front: items[idx][0], back: items[idx][1]};
}

function renderFaceText(face, text, markZeros){
  face.textContent = "";
  if(!markZeros){
    face.textContent = text;
    return;
  }
  for(const character of text){
    if(character === "0"){
      const zero = document.createElement("span");
      zero.className = "answer-zero";
      zero.textContent = character;
      face.appendChild(zero);
    }else{
      face.appendChild(document.createTextNode(character));
    }
  }
}

function renderCard(){
  const card = document.getElementById("card");
  const face = document.getElementById("cardFace");
  const hint = document.getElementById("cardHint");
  const tag = document.getElementById("cardTag");
  const groupLabel = hasGroups(state.cat) && state.group !== "__all__" ? " · " + state.group : "";
  tag.textContent = (CAT_LABELS[state.cat] || "") + groupLabel;
  const item = currentItem();
  const btnGood = document.getElementById("btnGood");
  const btnBad = document.getElementById("btnBad");

  if(!item){
    card.classList.remove("flipped");
    card.classList.add("done");
    face.textContent = t("round_done");
    hint.textContent = "";
    btnGood.disabled = true;
    btnBad.disabled = true;
    updateStats();
    return;
  }
  card.classList.remove("done");
  if(state.flipped){
    card.classList.add("flipped");
    renderFaceText(face, item.back, true);
    hint.textContent = t("tap_to_flip_back");
    btnGood.disabled = false;
    btnBad.disabled = false;
  }else{
    card.classList.remove("flipped");
    face.textContent = item.front;
    hint.textContent = t("tap_to_flip");
    btnGood.disabled = true;
    btnBad.disabled = true;
  }
  updateStats();
}

function updateStats(){
  document.getElementById("cntLeft").textContent = Math.max(0, state.deck.length - state.pos);
  updateHeaderProgress();
}

function cssVar(name, fallback){
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}

function updateHeaderProgress(){
  const wholeArea = !hasGroups(state.cat) || state.group === "__all__";
  const {counts, total} = boxCounts(state.cat, wholeArea ? "__all__" : state.group);
  const boxBars = document.getElementById("headerBoxBars");
  if(boxBars) boxBars.innerHTML = boxBarsInnerHtml(counts, total);
  const dot = document.getElementById("headerDot");
  if(dot){
    const info = wholeArea ? passDotInfo(state.cat) : null;
    dot.classList.toggle("visible", !!info);
    if(info){ dot.style.background = info.color; dot.title = Math.round(info.pct) + "%"; }
  }
}

function flip(){
  if(!currentItem()){
    state.sessionGood = 0; state.sessionBad = 0;
    buildDeck();
    renderCard();
    return;
  }
  state.flipped = !state.flipped;
  renderCard();
}

function grade(good){
  const item = currentItem();
  if(!item) return;
  const box = getBox(state.cat, item.idx);
  setBox(state.cat, item.idx, good ? box+1 : 1);
  if(good) state.sessionGood++; else state.sessionBad++;
  state.pos++;
  state.flipped = false;
  renderCard();
  renderStats();
}

function renderAreaNav(){
  const sel = document.getElementById("areaSelect");
  sel.innerHTML = Object.keys(CAT_LABELS).map(cat =>
    '<option value="' + cat + '">' + CAT_LABELS[cat] + '</option>'
  ).join("");
}

function setCategory(cat, forcedGroup){
  state.cat = cat;
  if(forcedGroup !== undefined && forcedGroup !== null){
    state.group = forcedGroup;
  }else{
    const validGroups = GROUP_ORDER[cat] || [];
    state.group = validGroups.length ? "__all__" : "__all__";
  }
  document.getElementById("areaSelect").value = cat;
  state.sessionGood = 0;
  state.sessionBad = 0;
  renderSubgroupBar();
  buildDeck();
  renderCard();
  saveLastNav();
}

function setGroup(group){
  state.group = group;
  state.sessionGood = 0;
  state.sessionBad = 0;
  buildDeck();
  renderCard();
  saveLastNav();
}

// ============================================================
// Statistiky úspěšnosti
// ============================================================
// Logaritmická křivka pro barevný přechod od oranžové (30°) ke zelené (90°)
// Vstup: procenta 0-1, kde 0 = oranžová (30°), 1 = zelená (90°)
function logarithmicHue(normalizedPct) {
  const logVal = Math.log10(Math.max(0, Math.min(1, normalizedPct)) * 9 + 1);
  return 30 + logVal * 60; // logVal jde od 0 do 1, hue od 30° do 90°
}
function hexToRgb(hex){
  hex = hex.replace('#','').trim();
  if(hex.length === 3) hex = hex.split('').map(c => c+c).join('');
  const num = parseInt(hex, 16) || 0;
  return {r:(num>>16)&255, g:(num>>8)&255, b:num&255};
}
function rgbToHex(r,g,b){
  const h = x => Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0');
  return '#' + h(r) + h(g) + h(b);
}
function lerpColor(c1, c2, t){
  return {r:c1.r+(c2.r-c1.r)*t, g:c1.g+(c2.g-c1.g)*t, b:c1.b+(c2.b-c1.b)*t};
}
function successColor(pct){
  const red = hexToRgb(cssVar('--red-ui','#e2543a'));
  const mid = hexToRgb(cssVar('--panel-accent','#ffb020'));
  const green = hexToRgb(cssVar('--green-ui','#6fe3a0'));
  const c = pct <= 50 ? lerpColor(red, mid, pct/50) : lerpColor(mid, green, (pct-50)/50);
  return rgbToHex(c.r, c.g, c.b);
}

// Práh pro danou oblast (v %), odvozený z maxErrors a aktuálního počtu
// kartiček v oblasti (ne z pevného počtu — sada může mít víc otázek, než
// kolik jich komise vybere k ostré zkoušce). Vrací null, pokud oblast
// žádný maxErrors nemá — pak se použije starý plynulý gradient.
function areaThresholdPct(cat){
  const maxErrors = AREA_MAX_ERRORS[cat];
  if(maxErrors == null) return null;
  const total = (DATA[cat] || []).length;
  if(!total) return null;
  return Math.max(0, (1 - maxErrors/total) * 100);
}

// Barva s prahem: pod prahem pevná červená, od prahu do 100% logaritmický
// přechod (oranžová→zelená). Bez prahu (thresholdPct === null) se chová
// jako stará plynulá škála 0-100 %.
function successColorFor(pct, thresholdPct){
  if(thresholdPct == null) return successColor(pct);
  if(pct < thresholdPct) return 'hsl(0, 75%, 48%)'; // red, tlumená
  
  // Od prahu do 100%: logaritmický gradient z oranžové na zelenou
  const span = 100 - thresholdPct;
  const normalized = span > 0 ? (pct - thresholdPct) / span : 1;
  const hue = logarithmicHue(normalized);
  return `hsl(${hue}, 75%, 50%)`;
}

// Rozložení kartiček do Leitnerových boxů 1-5 pro danou oblast, volitelně
// omezené na jednu podoblast. counts[i] = počet kartiček v boxu i+1.
function boxCounts(cat, group){
  const items = DATA[cat] || [];
  const counts = [0,0,0,0,0];
  let total = 0;
  items.forEach((it, i) => {
    if(group && group !== "__all__" && it[2] !== group) return;
    counts[getBox(cat, i) - 1]++;
    total++;
  });
  return {counts, total};
}

// Vážený průměr boxu napříč kartičkami, normalizovaný na 0-100 %
// (box1=0 %, box5=100 %) — hrubý odhad šance na správnou odpověď u
// zkoušky, použitý jako vstup do prahové barvy pass/fail tečky.
function weightedBoxPct(counts, total){
  if(!total) return 0;
  let sum = 0;
  counts.forEach((c, i) => { sum += c * (i/4*100); });
  return sum/total;
}

// HTML pěti sloupečků (bez obalového .box-bars) — barva podle POZICE boxu
// (box1 červená .. box5 zelená), výška podle podílu kartiček v tom boxu.
// Prázdný box se pořád zobrazí (minimální výška), aby bylo vidět všech 5.
// Konstantní barvy: R, R-O, O, Y, G; tlumené (S=70-80%, L=48-52%)
function boxBarsInnerHtml(counts, total){
  const colors = ['hsl(0, 75%, 48%)', 'hsl(15, 80%, 48%)', 'hsl(30, 80%, 48%)', 'hsl(45, 75%, 50%)', 'hsl(90, 70%, 52%)'];
  let html = "";
  for(let i=0;i<5;i++){
    const frac = total ? counts[i]/total : 0;
    const heightPct = Math.max(8, Math.round(frac*100));
    const color = counts[i] === 0 ? cssVar('--border', '#2a3436') : colors[i];
    html += '<div class="box-bar" style="height:'+heightPct+'%;background:'+color+';" title="Box '+(i+1)+': '+counts[i]+'"></div>';
  }
  return html;
}
function boxBarsHtml(counts, total){
  return '<div class="box-bars">' + boxBarsInnerHtml(counts, total) + '</div>';
}

// Info pro pass/fail tečku dané oblasti, nebo null, když oblast nemá
// maxErrors (pak se tečka vůbec nezobrazuje — viz FORMAT.md).
function passDotInfo(cat){
  const threshold = areaThresholdPct(cat);
  if(threshold == null) return null;
  const {counts, total} = boxCounts(cat, "__all__");
  const pct = weightedBoxPct(counts, total);
  return {pct, color: successColorFor(pct, threshold)};
}
function passDotHtml(cat){
  const info = passDotInfo(cat);
  if(!info) return '<span class="pass-dot"></span>';
  return '<span class="pass-dot visible" style="background:'+info.color+';" title="'+Math.round(info.pct)+'%"></span>';
}

function renderStats(){
  const container = document.getElementById("statsList");
  if(!container) return;
  let html = "";
  Object.keys(STATS_CAT_LABELS).forEach(cat => {
    const {counts, total} = boxCounts(cat, "__all__");
    html += '<div class="stats-cat" data-cat="'+cat+'" data-group="__all__">'
      + '<div class="stats-cat-head">'
      + '<span class="stats-cat-name">'+STATS_CAT_LABELS[cat]+'</span>'
      + passDotHtml(cat)
      + boxBarsHtml(counts, total)
      + '</div></div>';
    (GROUP_ORDER[cat] || []).forEach(group => {
      const g = boxCounts(cat, group);
      const safeGroup = group.replace(/"/g, '&quot;');
      html += '<div class="stats-row" data-cat="'+cat+'" data-group="'+safeGroup+'">'
        + '<span class="stats-row-name">'+group+'</span>'
        + boxBarsHtml(g.counts, g.total)
        + '</div>';
    });
  });
  container.innerHTML = html;
}

document.getElementById("statsList").addEventListener("click", e => {
  const row = e.target.closest("[data-cat]");
  if(!row) return;
  setCategory(row.dataset.cat, row.dataset.group);
  document.querySelector(".wrap").scrollIntoView({behavior:"smooth", block:"start"});
});

// ============================================================
// Režim handsfree (TTS + Media Session ovládání přes Next/Prev Track)
// ============================================================
let drivingModeActive = false;
let silentAudioEl = null;
let wakeLockSentinel = null;

async function requestWakeLock(){
  if(!("wakeLock" in navigator)) return;
  try{
    wakeLockSentinel = await navigator.wakeLock.request("screen");
    wakeLockSentinel.addEventListener("release", () => { wakeLockSentinel = null; });
  }catch(e){
    wakeLockSentinel = null;
  }
}
function releaseWakeLock(){
  if(wakeLockSentinel){
    try{ wakeLockSentinel.release(); }catch(e){}
    wakeLockSentinel = null;
  }
}
document.addEventListener("visibilitychange", () => {
  if(drivingModeActive && document.visibilityState === "visible" && !wakeLockSentinel){
    requestWakeLock();
  }
});

function speak(text, onDone){
  if(!("speechSynthesis" in window) || !text){
    if(onDone) onDone();
    return;
  }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (library[activeSetId] && library[activeSetId].language) || "cs-CZ";
    if(onDone){
      u.onend = onDone;
      u.onerror = onDone;
    }
    window.speechSynthesis.speak(u);
  }catch(e){
    if(onDone) onDone();
  }
}

function speakFront(){
  const item = currentItem();
  if(item) speak(item.front);
}
function speakBack(){
  const item = currentItem();
  if(item) speak(item.back);
}
// Hlasové fráze v handsfree režimu se řídí jazykem AKTIVNÍ SADY KARTIČEK
// (ne jazykem rozhraní) — ať zní jedno souvislé mluvené pásmo, ne mix dvou
// jazyků. Zatím vestavěno česky a anglicky, cokoliv jiného spadne na
// angličtinu.
const SPOKEN_PHRASES = {
  cs: {
    mode_active: "Režim handsfree aktivní. Program ovládejte tlačítky pro další nebo předchozí skladbu.",
    whole_area: "celá oblast ",
    next_selection: "Další výběr.",
    selection_restarted: "Výběr restartován.",
    round_done: "Kolo dokončeno.",
    know: "Znal jsi.",
    dont_know: "Neznal jsi.",
    reading_again: "Čtu znovu."
  },
  en: {
    mode_active: "Handsfree mode active. Control it with the next or previous track buttons.",
    whole_area: "the whole area ",
    next_selection: "Next selection.",
    selection_restarted: "Selection restarted.",
    round_done: "Round complete.",
    know: "You knew it.",
    dont_know: "You didn't know it.",
    reading_again: "Reading again."
  }
};
function spokenLangPrefix(){
  const langTag = (library[activeSetId] && library[activeSetId].language) || "en-US";
  const prefix = langTag.split("-")[0].toLowerCase();
  return SPOKEN_PHRASES[prefix] ? prefix : "en";
}
function sp(key){
  return SPOKEN_PHRASES[spokenLangPrefix()][key];
}

function announceCurrentState(){
  if(!drivingModeActive) return;
  const item = currentItem();
  if(!item){ speak(sp("round_done")); return; }
  if(state.flipped) speakBack(); else speakFront();
}

function scopeSpokenLabel(cat, group){
  const catName = STATS_CAT_LABELS[cat] || cat;
  return (group && group !== "__all__") ? (catName + ", " + group) : (sp("whole_area") + catName);
}

function allSubgroupScopes(){
  const scopes = [];
  Object.keys(CAT_LABELS).forEach(cat => {
    (GROUP_ORDER[cat] || []).forEach(g => scopes.push({cat, group: g}));
  });
  return scopes;
}
function allCategoryScopes(){
  return Object.keys(CAT_LABELS).map(cat => ({cat, group: "__all__"}));
}

function advanceScope(){
  if(state.group === "__all__"){
    const scopes = allCategoryScopes();
    const i = scopes.findIndex(s => s.cat === state.cat && s.group === "__all__");
    const next = scopes[(i + 1) % scopes.length];
    setCategory(next.cat, next.group);
  }else{
    const scopes = allSubgroupScopes();
    const i = scopes.findIndex(s => s.cat === state.cat && s.group === state.group);
    const next = scopes[(i + 1) % scopes.length];
    setCategory(next.cat, next.group);
  }
  updateDrivingMetadata();
}

function updateDrivingMetadata(){
  if(!drivingModeActive || !("mediaSession" in navigator)) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: scopeSpokenLabel(state.cat, state.group),
      artist: "OK Trainer — " + (library[activeSetId] ? library[activeSetId].shortName : "")
    });
  }catch(e){}
}

function speakNextCardOrDone(){
  if(currentItem()) speakFront();
  else speak(sp("round_done"));
}

function drivingNext(){
  if(!currentItem()){
    advanceScope();
    speak(sp("next_selection") + " " + scopeSpokenLabel(state.cat, state.group) + ".", speakFront);
    return;
  }
  if(!state.flipped){
    flip();
    speakBack();
  }else{
    grade(true);
    speak(sp("know"), speakNextCardOrDone);
  }
}

function drivingPrev(){
  if(!currentItem()){
    state.sessionGood = 0; state.sessionBad = 0;
    buildDeck();
    renderCard();
    speak(sp("selection_restarted"), speakFront);
    return;
  }
  if(!state.flipped){
    speak(sp("reading_again"), speakFront);
  }else{
    grade(false);
    speak(sp("dont_know"), speakNextCardOrDone);
  }
}

function startDrivingMode(){
  if(!("speechSynthesis" in window) || !("mediaSession" in navigator)){
    alert(t("err_no_speech_support"));
    return;
  }

  if(!silentAudioEl){
    silentAudioEl = new Audio("keepalive.wav");
    silentAudioEl.loop = true;
    // Zvuk musí aktivně hrát, aby apka vůbec získala audio focus (bez
    // přehrávaného <audio> elementu Media Session API na Androidu
    // nefunguje). Ověřeno na reálném zařízení: volume = 0 apku z audio
    // focusu úplně vyřadí, zatímco jakákoliv nenulová hodnota funguje —
    // 0.00001 je prakticky neslyšitelná. Spolehlivost s vypnutou obrazovkou
    // řeší Wake Lock níže, ne hlasitost.
    silentAudioEl.volume = 0.00001;
  }
  silentAudioEl.play().catch(() => {});
  requestWakeLock();

  const actions = {
    "nexttrack": drivingNext,
    "previoustrack": drivingPrev,
    "seekforward": drivingNext,
    "seekbackward": drivingPrev,
    "play": () => {},
    "pause": () => {},
    "stop": stopDrivingMode,
  };
  Object.keys(actions).forEach(name => {
    try{ navigator.mediaSession.setActionHandler(name, actions[name]); }catch(e){}
  });
  navigator.mediaSession.playbackState = "playing";

  drivingModeActive = true;
  updateDrivingMetadata();
  const btn = document.getElementById("btnDriving");
  if(btn){ btn.textContent = t("driving_stop"); btn.classList.add("active"); }

  speak(
    sp("mode_active") + " " + scopeSpokenLabel(state.cat, state.group) + ".",
    speakFront
  );
}

function stopDrivingMode(){
  drivingModeActive = false;
  releaseWakeLock();
  if(silentAudioEl){ silentAudioEl.pause(); }
  try{
    ["nexttrack","previoustrack","seekforward","seekbackward","play","pause","stop"].forEach(name => {
      try{ navigator.mediaSession.setActionHandler(name, null); }catch(e){}
    });
    navigator.mediaSession.playbackState = "none";
  }catch(e){}
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
  const btn = document.getElementById("btnDriving");
  if(btn){ btn.textContent = t("driving_start"); btn.classList.remove("active"); }
}

document.getElementById("btnDriving") && document.getElementById("btnDriving").addEventListener("click", () => {
  if(drivingModeActive) stopDrivingMode(); else startDrivingMode();
});

// ============================================================
// Ovládání
// ============================================================
document.getElementById("areaSelect").addEventListener("change", e => {
  setCategory(e.target.value);
});
document.getElementById("subgroupSelect").addEventListener("change", e => {
  setGroup(e.target.value);
});
document.getElementById("card").addEventListener("click", () => {
  flip();
  announceCurrentState();
});
document.getElementById("btnGood").addEventListener("click", () => {
  grade(true);
  announceCurrentState();
});
document.getElementById("btnBad").addEventListener("click", () => {
  grade(false);
  announceCurrentState();
});
document.getElementById("btnResetScope").addEventListener("click", () => {
  const scope = hasGroups(state.cat) && state.group !== "__all__" ? state.group : CAT_LABELS[state.cat];
  if(!confirm(t("confirm_reset_scope", {scope, setId: activeSetId}))) return;
  const items = DATA[state.cat] || [];
  items.forEach((it, i) => {
    if(state.group === "__all__" || it[2] === state.group){
      delete progress[cardKey(state.cat, i)];
    }
  });
  saveProgress();
  state.sessionGood = 0; state.sessionBad = 0;
  buildDeck(); renderCard(); renderStats();
});
document.getElementById("btnResetAll").addEventListener("click", () => {
  if(!confirm(t("confirm_reset_all", {setId: activeSetId}))) return;
  progress = {};
  saveProgress();
  state.sessionGood = 0; state.sessionBad = 0;
  buildDeck(); renderCard(); renderStats();
});
document.getElementById("onlyHard").addEventListener("change", () => {
  state.sessionGood = 0; state.sessionBad = 0;
  buildDeck(); renderCard();
});
document.addEventListener("keydown", e => {
  if(e.code === "Space"){ e.preventDefault(); flip(); announceCurrentState(); }
  else if(e.code === "ArrowRight" && state.flipped){ grade(true); announceCurrentState(); }
  else if(e.code === "ArrowLeft" && state.flipped){ grade(false); announceCurrentState(); }
  else if(drivingModeActive){
    if(e.key === "MediaTrackNext"){ drivingNext(); }
    else if(e.key === "MediaTrackPrevious"){ drivingPrev(); }
  }
});

if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    updateHeaderProgress();
    renderStats();
  });
}

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

// ============================================================
// Inicializace
// ============================================================
switchToSet(activeSetId);
applyTranslations();
</script>
